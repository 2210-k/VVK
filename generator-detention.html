<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Протокол задержания</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; padding: 15px; margin: 0; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; position: relative; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        input[type="text"], input[type="number"], textarea, select {
            width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;
            box-sizing: border-box; font-size: 15px; font-family: inherit;
        }
        textarea { resize: vertical; height: 60px; }
        .form-select { background-color: #eef5ff; font-weight: bold; margin-bottom: 5px; cursor: pointer; }
        button[type="submit"] { background: #0056b3; color: white; border: none; padding: 15px; font-size: 16px; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 20px; font-weight: bold; }
        button[type="submit"]:disabled { background: #ccc; }
        .row { display: flex; gap: 15px; flex-wrap: wrap; }
        .row > .form-group { flex: 1; min-width: 140px; }
        .date-group { display: flex; gap: 5px; }
        .date-group input, .date-group select { text-align: center; }
        .date-group .part { flex: 1; }
        .back-btn { display: inline-block; margin-bottom: 20px; color: #0056b3; text-decoration: none; font-weight: bold; }
        .patient-selector { background: #eef5ff; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #b3ccee; }
        .section-title { background: #e2e8f0; padding: 8px 12px; border-radius: 4px; margin: 20px 0 12px; font-weight: bold; color: #1e3a8a; font-size: 14px; }
        
        .checkbox-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; background: #f9f9f9; padding: 10px; border-radius: 6px; }
        .checkbox-row { display: flex; align-items: flex-start; gap: 10px; font-size: 14px; }
        .checkbox-row input[type="checkbox"] { width: 18px; height: 18px; margin-top: 2px; cursor: pointer; }
        .checkbox-row label { margin: 0; font-weight: normal; cursor: pointer; }
        .term-row { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }
        .term-row input[type="text"] { width: 200px; }

        .radio-inline { display: flex; gap: 20px; padding: 8px 0; }
        .radio-inline label { display: flex; align-items: center; gap: 6px; font-weight: normal; cursor: pointer; }
        .radio-inline input { width: auto; }

        .autocomplete-dropdown { position: absolute; top: 100%; left: 0; right: 0; background: white; border: 1px solid #ccc; border-radius: 0 0 4px 4px; max-height: 220px; overflow-y: auto; z-index: 100; display: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .autocomplete-item { padding: 10px; cursor: pointer; border-bottom: 1px solid #eee; font-size: 13px; }
        .autocomplete-item:hover { background-color: #eef5ff; }
        .autocomplete-item b { color: #0056b3; }

        #preview-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; flex-direction: column; }
        .preview-container { width: 95%; height: 95%; background: white; border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; }
        .preview-header { padding: 15px 20px; background: #f8fafc; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; flex-wrap: wrap; gap: 10px; }
        .preview-iframe { flex: 1; width: 100%; border: none; }
        .btn-preview { border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-dl { background: #10b981; color: white; }
        .btn-close { background: #ef4444; color: white; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="back-btn">← Вернуться на портал</a>

    <div class="patient-selector">
        <label>👤 Задержанный (данные подставятся автоматически)</label>
        <select id="detainedSelect" class="form-select">
            <option value="none">-- Выберите гражданина --</option>
        </select>
    </div>

    <h2>Протокол задержания</h2>

    <form id="detentionForm">

        <div class="section-title">Общие реквизиты (заполняются один раз)</div>
        <div class="row">
            <div class="form-group">
                <label>Дата (ДД / МММ / ГГ)</label>
                <div class="date-group">
                    <input type="text" id="globalDay" class="part" maxlength="2" placeholder="ДД" required>
                    <select id="globalMonth" class="part" required></select>
                    <input type="text" id="globalYear" class="part" maxlength="2" placeholder="ГГ" required>
                </div>
            </div>
            <div class="form-group">
                <label>Номер дня (000–999)</label>
                <input type="text" id="dayNumber" style="text-align:center;" maxlength="3" required>
            </div>
            <div class="form-group">
                <label>№ документа (0118ННН)</label>
                <input type="text" id="docNumber" style="text-align:center;" required>
            </div>
        </div>

        <div class="section-title">Тип и время составления</div>
        <div class="form-group">
            <label>Тип задержания (подчеркнуть)</label>
            <div class="radio-inline">
                <label><input type="radio" name="detentionType" value="criminal" checked> преступления</label>
                <label><input type="radio" name="detentionType" value="admin"> административного правонарушения</label>
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Время составления (ЧЧ : ММ)</label>
                <div class="date-group">
                    <input type="text" id="compTimeH" class="part" maxlength="2" placeholder="ЧЧ" required>
                    <input type="text" id="compTimeM" class="part" maxlength="2" placeholder="ММ" required>
                </div>
            </div>
            <div class="form-group">
                <label>Место составления</label>
                <select id="template-compPlace" class="form-select">
                    <option value="">-- Шаблон --</option>
                    <option value="г. Соль-Илецк, ул. Васильковая, д. 40/1 (Отдел МВД)">г. Соль-Илецк, ул. Васильковая, д. 40/1 (Отдел МВД)</option>
                </select>
                <input type="text" id="compPlace" required>
            </div>
        </div>

        <div class="form-group">
            <label>Сотрудник, составивший протокол (должность)</label>
            <select id="template-official" class="form-select">
                <option value="">-- Шаблон --</option>
                <option value="Начальник МВД по Соль-Илецкому г.о., генерал полиции">Начальник МВД по Соль-Илецкому г.о., генерал полиции</option>
            </select>
            <input type="text" id="official" required>
        </div>
        
        <div class="form-group">
            <label>ФИО сотрудника (для подписи)</label>
            <input type="text" id="officialName" placeholder="Например: Иванов И.И." required>
        </div>

        <div class="section-title">Сведения о задержанном лице</div>
        <div class="form-group">
            <label>Фамилия, имя, отчество</label>
            <input type="text" id="detainedFio" required>
        </div>
        <div class="row">
            <div class="form-group">
                <label>Дата рождения (ДД / МММ / ГГ)</label>
                <div class="date-group">
                    <input type="text" id="dobDay" class="part" maxlength="2" placeholder="ДД">
                    <select id="dobMonth" class="part"></select>
                    <input type="text" id="dobYear" class="part" maxlength="2" placeholder="ГГ">
                </div>
            </div>
            <div class="form-group">
                <label>Место рождения</label>
                <input type="text" id="pob">
            </div>
        </div>
        <div class="row">
            <div class="form-group">
                <label>Паспорт: серия</label>
                <input type="text" id="passSeries" maxlength="4" style="text-align:center;">
            </div>
            <div class="form-group">
                <label>Паспорт: номер</label>
                <input type="text" id="passNumber" maxlength="6" style="text-align:center;">
            </div>
        </div>
        <div class="row">
            <div class="form-group">
                <label>Адрес регистрации</label>
                <input type="text" id="address">
            </div>
            <div class="form-group">
                <label>Номер телефона</label>
                <input type="text" id="phone" style="text-align:center;">
            </div>
            <div class="form-group">
                <label>Семейное положение</label>
                <select id="maritalStatus" class="form-select">
                    <option value="Женат">Женат</option>
                    <option value="Холост">Холост</option>
                </select>
            </div>
        </div>
        
        <div class="form-group">
            <label>Место работы (учёбы)</label>
            <input type="text" id="workPlace" placeholder="Начните вводить для поиска..." autocomplete="off">
            <div id="workDropdown" class="autocomplete-dropdown"></div>
        </div>

        <div class="section-title">Обстоятельства задержания</div>
        <div class="row">
            <div class="form-group">
                <label>Время фактического задержания (ЧЧ : ММ)</label>
                <div class="date-group">
                    <input type="text" id="detTimeH" class="part" maxlength="2" placeholder="ЧЧ" required>
                    <input type="text" id="detTimeM" class="part" maxlength="2" placeholder="ММ" required>
                </div>
            </div>
            <div class="form-group">
                <label>Адрес задержания</label>
                <input type="text" id="detAddress" required>
            </div>
        </div>

        <div class="form-group">
            <label>Основания задержания</label>
            <div class="checkbox-group">
                <div class="checkbox-row"><input type="checkbox" id="g1"><label for="g1">лицо застигнуто при совершении правонарушения (преступления);</label></div>
                <div class="checkbox-row"><input type="checkbox" id="g2"><label for="g2">очевидцы прямо указали на данное лицо;</label></div>
                <div class="checkbox-row"><input type="checkbox" id="g3"><label for="g3">на лице, одежде или при нём обнаружены явные следы;</label></div>
                <div class="checkbox-row"><input type="checkbox" id="g4"><label for="g4">лицо пыталось скрыться;</label></div>
                <div class="checkbox-row"><input type="checkbox" id="g5"><label for="g5">отсутствуют документы, удостоверяющие личность;</label></div>
                <div class="checkbox-row"><input type="checkbox" id="g6"><label for="g6">иное:</label></div>
                <input type="text" id="groundsOther" placeholder="Укажите иное основание" style="margin-left: 28px; width: calc(100% - 28px);">
            </div>
        </div>

        <div class="form-group">
            <label>Статья (пункт, часть) закона, инкриминируемая задержанному</label>
            <input type="text" id="articleInput" placeholder="Начните вводить (например: 1.1 или убийство)" required autocomplete="off">
            <div id="articleDropdown" class="autocomplete-dropdown"></div>
        </div>

        <div class="form-group">
            <label>Срок задержания</label>
            <div class="checkbox-group">
                <div class="term-row">
                    <input type="checkbox" id="termCheckAdmin" class="term-category" style="width: 18px; height: 18px;">
                    <label for="termCheckAdmin" style="margin: 0; font-weight: bold;">административное задержание:</label>
                    <input type="text" id="termTextAdmin" placeholder="до 3 часов / до 48 часов" style="width: 250px;">
                </div>
                <div class="term-row">
                    <input type="checkbox" id="termCheckCriminal" class="term-category" style="width: 18px; height: 18px;">
                    <label for="termCheckCriminal" style="margin: 0; font-weight: bold;">задержание по подозрению в совершении преступления:</label>
                    <input type="text" id="termTextCriminal" placeholder="до 48 часов" style="width: 250px;">
                </div>
            </div>
        </div>

        <div class="section-title">Страница 2</div>
        
        <div class="form-group">
            <label>Объяснения по существу задержания</label>
            <select id="template-explanations" class="form-select">
                <option value="">-- Шаблон --</option>
                <option value="От дачи объяснений отказался, воспользовавшись правом, предусмотренным статьей 51 Конституции Российской Федерации (право не свидетельствовать против себя и своих близких)">От дачи объяснений отказался...</option>
            </select>
            <textarea id="explanations"></textarea>
        </div>

        <div class="form-group">
            <label>Ходатайства и заявления задержанного</label>
            <select id="template-petitions" class="form-select">
                <option value="">-- Шаблон --</option>
                <option value="Не поступало">Не поступало</option>
            </select>
            <textarea id="petitions"></textarea>
        </div>

        <div class="form-group">
            <label>Защитник (если участвовал)</label>
            <select id="template-defender" class="form-select">
                <option value="">-- Шаблон --</option>
                <option value="Не участвовал">Не участвовал</option>
            </select>
            <input type="text" id="defender" placeholder="Фамилия, имя, отчество, № удостоверения, № ордера">
        </div>

        <div class="form-group">
            <label>Понятой 1 (выбор из базы)</label>
            <select id="witness1Select" class="form-select">
                <option value="none">-- Выбрать из базы --</option>
            </select>
            <input type="text" id="witness1" placeholder="Фамилия, имя, отчество, № паспорта, адрес регистрации">
        </div>

        <div class="form-group">
            <label>Понятой 2 (выбор из базы)</label>
            <select id="witness2Select" class="form-select">
                <option value="none">-- Выбрать из базы --</option>
            </select>
            <input type="text" id="witness2" placeholder="Фамилия, имя, отчество, № паспорта, адрес регистрации">
        </div>

        <div class="form-group">
            <label>Иные участвующие лица</label>
            <select id="template-others" class="form-select">
                <option value="">-- Шаблон --</option>
                <option value="отсутствуют">отсутствуют</option>
            </select>
            <input type="text" id="others">
        </div>

        <div class="row">
            <div class="form-group">
                <label>Личный обыск проводился</label>
                <div class="radio-inline">
                    <label><input type="radio" name="searchConducted" value="yes" checked> Да</label>
                    <label><input type="radio" name="searchConducted" value="no"> Нет</label>
                </div>
            </div>
            <div class="form-group">
                <label>Номер протокола личного досмотра</label>
                <select id="searchProtocolSelect" class="form-select">
                    <option value="">-- Загрузка... --</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>Замечания к протоколу</label>
            <select id="template-notes" class="form-select">
                <option value="">-- Шаблон --</option>
                <option value="не выявлено">не выявлено</option>
            </select>
            <textarea id="notes"></textarea>
        </div>

        <div class="form-group">
            <label>Отметка о направлении в место содержания (ИВС, КПЗ)</label>
            <select id="template-direction" class="form-select">
                <option value="">-- Шаблон --</option>
                <option value="Направлен для содержания в КПЗ МВД по Соль-Илецкому г.о.">Направлен для содержания в КПЗ МВД по Соль-Илецкому г.о.</option>
            </select>
            <textarea id="direction"></textarea>
        </div>

        <button type="submit" id="submitBtn">Сгенерировать и сохранить PDF</button>
    </form>
</div>

<div id="preview-modal">
    <div class="preview-container">
        <div class="preview-header">
            <h3>Предпросмотр протокола</h3>
            <div>
                <button class="btn-preview btn-dl" id="download-btn">Скачать PDF</button>
                <button class="btn-preview btn-close" id="close-preview-btn">Закрыть</button>
            </div>
        </div>
        <iframe id="pdf-preview-frame" class="preview-iframe"></iframe>
    </div>
</div>

    async function loadData() {
        const { data: citizens } = await supabaseClient
            .from('profiles')
            .select('id, last_name, first_name, patronymic, dob, pob, address, pass_series, pass_number')
            .eq('role', 'patient')
            .order('last_name');
        
        if (citizens) {
            allCitizensCache = citizens;
            const dSelect = document.getElementById('detainedSelect');
            const w1 = document.getElementById('witness1Select');
            const w2 = document.getElementById('witness2Select');
            
            dSelect.innerHTML = '<option value="none">-- Выберите гражданина --</option>';
            w1.innerHTML = '<option value="none">-- Выбрать из базы --</option>';
            w2.innerHTML = '<option value="none">-- Выбрать из базы --</option>';

            citizens.forEach(p => {
                const fio = `${p.last_name} ${p.first_name} ${p.patronymic || ''}`.trim();
                dSelect.add(new Option(fio, p.id));
                
                const wLabel = `${p.last_name} ${p.first_name} ${p.patronymic || ''}, № ${p.pass_series || ''} ${p.pass_number || ''}, ${p.address || ''}`.trim();
                w1.add(new Option(wLabel, p.id));
                w2.add(new Option(wLabel, p.id));
            });
        }

        // ✅ ЗАГРУЗКА ПРОТОКОЛОВ С ИДЕНТИФИКАТОРОМ ГРАЖДАНИНА
        const { data: protocols } = await supabaseClient
            .from('documents')
            .select('doc_number, patient_id')
            .eq('document_type', 'Протокол личного досмотра')
            .order('created_at', { ascending: false });

        if (protocols) {
            const pSelect = document.getElementById('searchProtocolSelect');
            pSelect.innerHTML = '<option value="">-- Не проводился --</option>';
            protocols.forEach(p => {
                // Ищем ФИО по ID в уже загруженном кэше
                let fio = 'В архиве';
                if (p.patient_id) {
                    const c = allCitizensCache.find(x => x.id === p.patient_id);
                    if (c) fio = `${c.last_name} ${c.first_name} ${c.patronymic || ''}`.trim();
                }
                // В value оставляем ТОЛЬКО номер
                pSelect.add(new Option(`${p.doc_number} — ${fio}`, p.doc_number));
            });
        }
    }

    function initWorkAutocomplete() {
        const inp = document.getElementById('workPlace');
        const dd = document.getElementById('workDropdown');

        inp.addEventListener('input', () => {
            const q = inp.value.toLowerCase();
            dd.innerHTML = '';
            if (!q) { dd.style.display = 'none'; return; }
            const matches = WORK_PLACES.filter(w => w.toLowerCase().includes(q));
            if (matches.length) {
                matches.forEach(w => {
                    const div = document.createElement('div');
                    div.className = 'autocomplete-item';
                    div.textContent = w;
                    div.onclick = () => { inp.value = w; dd.style.display = 'none'; };
                    dd.appendChild(div);
                });
                dd.style.display = 'block';
            } else dd.style.display = 'none';
        });

        inp.addEventListener('focus', () => { if (inp.value) inp.dispatchEvent(new Event('input')); });
        document.addEventListener('click', e => {
            if (e.target !== inp && e.target !== dd) dd.style.display = 'none';
        });
    }

    function initArticleAutocomplete() {
        const inp = document.getElementById('articleInput');
        const dd = document.getElementById('articleDropdown');

        inp.addEventListener('input', () => {

            dd.innerHTML = '';
            if (!q) { dd.style.display = 'none'; currentArticle = null; return; }
            const matches = ARTICLES_DB.filter(a =>

    function drawCenteredInRange(page, text, xStart, xEnd, y, options) {
        if (!text) return;
        const w = options.font.widthOfTextAtSize(text, options.size);
        page.drawText(text, { ...options, x: xStart + ((xEnd - xStart) - w) / 2, y });
    }

    function drawParagraph(page, text, x, y, options) {
        if (!text) return y;
        const { font, size, color, maxWidth, lineHeight, indent } = options;
        const words = text.split(' ');
        let lines = [], cur = '', isFirst = true;
        for (const word of words) {
            const avail = isFirst ? (maxWidth - indent) : maxWidth;
            const test = cur === '' ? word : cur + ' ' + word;
            if (font.widthOfTextAtSize(test, size) <= avail) cur = test;
            else { lines.push({ t: cur, f: isFirst }); cur = word; isFirst = false; }
        }
        if (cur) lines.push({ t: cur, f: isFirst });
        let cy = y;
        for (const ln of lines) {
            page.drawText(ln.t, { x: ln.f ? x + indent : x, y: cy, font, size, color });
            cy -= lineHeight;
        }
        return cy;
    }

    function drawCross(page, x, y, size = 4) {
        page.drawLine({ start: { x: x - size, y: y - size }, end: { x: x + size, y: y + size }, thickness: 1.2, color: PDFLib.rgb(0, 0, 0) });
        page.drawLine({ start: { x: x - size, y: y + size }, end: { x: x + size, y: y - size }, thickness: 1.2, color: PDFLib.rgb(0, 0, 0) });
    }

            drawCenteredInRange(page1, getVal('dobYear'), COORDS.detainedDob.year.xStart, COORDS.detainedDob.year.xEnd, COORDS.detainedDob.year.y, opt);
            
            page1.drawText(getVal('pob'), { x: COORDS.pob.x, y: COORDS.pob.y, ...opt });
            drawCenteredInRange(page1, getVal('passSeries'), COORDS.passSeries.xStart, COORDS.passSeries.xEnd, COORDS.passSeries.y, opt);
            drawCenteredInRange(page1, getVal('passNumber'), COORDS.passNumber.xStart, COORDS.passNumber.xEnd, COORDS.passNumber.y, opt);
            
            drawParagraph(page1, getVal('address'), COORDS.address.x, COORDS.address.y, { ...opt, maxWidth: COORDS.address.maxWidth, lineHeight: COORDS.address.lineHeight, indent: 0 });
            drawCenteredInRange(page1, getVal('phone'), COORDS.phone.xStart, COORDS.phone.xEnd, COORDS.phone.y, opt);
            page1.drawText(getVal('maritalStatus'), { x: COORDS.maritalStatus.x, y: COORDS.maritalStatus.y, ...opt });

            page1.drawText(getVal('workPlace'), { x: COORDS.workPlace.x, y: COORDS.workPlace.y, ...opt });

            drawCenteredInRange(page1, getVal('globalDay'), COORDS.detTimePlace.day.xStart, COORDS.detTimePlace.day.xEnd, COORDS.detTimePlace.day.y, opt);
            drawCenteredInRange(page1, globalMonthWord, COORDS.detTimePlace.month.xStart, COORDS.detTimePlace.month.xEnd, COORDS.detTimePlace.month.y, opt);
            drawCenteredInRange(page1, getVal('globalYear'), COORDS.detTimePlace.year.xStart, COORDS.detTimePlace.year.xEnd, COORDS.detTimePlace.year.y, opt);
            drawCenteredInRange(page1, dayNum, COORDS.detTimePlace.dayNum.xStart, COORDS.detTimePlace.dayNum.xEnd, COORDS.detTimePlace.dayNum.y, opt);
            drawCenteredInRange(page1, getVal('detTimeH'), COORDS.detTimePlace.h.xStart, COORDS.detTimePlace.h.xEnd, COORDS.detTimePlace.h.y, opt);
            drawCenteredInRange(page1, getVal('detTimeM'), COORDS.detTimePlace.m.xStart, COORDS.detTimePlace.m.xEnd, COORDS.detTimePlace.m.y, opt);

            drawParagraph(page1, getVal('detAddress'), COORDS.detAddress.x, COORDS.detAddress.y, { ...opt, maxWidth: COORDS.detAddress.maxWidth, lineHeight: COORDS.detAddress.lineHeight, indent: 0 });

            if (document.getElementById('g1').checked) drawCross(page1, COORDS.grounds.g1.x, COORDS.grounds.g1.y);
            if (document.getElementById('g2').checked) drawCross(page1, COORDS.grounds.g2.x, COORDS.grounds.g2.y);
            if (document.getElementById('g3').checked) drawCross(page1, COORDS.grounds.g3.x, COORDS.grounds.g3.y);
            if (document.getElementById('g4').checked) drawCross(page1, COORDS.grounds.g4.x, COORDS.grounds.g4.y);
            if (document.getElementById('g5').checked) drawCross(page1, COORDS.grounds.g5.x, COORDS.grounds.g5.y);
            if (document.getElementById('g6').checked) {
                drawCross(page1, COORDS.grounds.g6.x, COORDS.grounds.g6.y);
                drawParagraph(page1, getVal('groundsOther'), COORDS.grounds.otherText.x, COORDS.grounds.otherText.y, { ...opt, maxWidth: COORDS.grounds.otherText.maxWidth, lineHeight: COORDS.grounds.otherText.lineHeight, indent: 0 });
            }

            drawParagraph(page1, getVal('articleInput'), COORDS.article.x, COORDS.article.y, { ...opt, maxWidth: COORDS.article.maxWidth, lineHeight: COORDS.article.lineHeight, indent: 0 });

            if (document.getElementById('termCheckAdmin').checked) {
                drawCross(page1, COORDS.terms.checkAdmin.x, COORDS.terms.checkAdmin.y);
                if (getVal('termTextAdmin')) page1.drawText(getVal('termTextAdmin'), { x: COORDS.terms.textAdmin.x, y: COORDS.terms.textAdmin.y, ...opt });
            }
            if (document.getElementById('termCheckCriminal').checked) {
                drawCross(page1, COORDS.terms.checkCriminal.x, COORDS.terms.checkCriminal.y);
                if (getVal('termTextCriminal')) page1.drawText(getVal('termTextCriminal'), { x: COORDS.terms.textCriminal.x, y: COORDS.terms.textCriminal.y, ...opt });
            }

            drawCenteredInRange(page1, getVal('detainedFio'), COORDS.signatureDetained.xStart, COORDS.signatureDetained.xEnd, COORDS.signatureDetained.y, opt);

            // --- СТРАНИЦА 2 ---

            drawParagraph(page2, getVal('explanations'), COORDS.explanations.x, COORDS.explanations.y, { ...opt, maxWidth: COORDS.explanations.maxWidth, lineHeight: COORDS.explanations.lineHeight, indent: COORDS.explanations.indent });
            drawParagraph(page2, getVal('petitions'), COORDS.petitions.x, COORDS.petitions.y, { ...opt, maxWidth: COORDS.petitions.maxWidth, lineHeight: COORDS.petitions.lineHeight, indent: COORDS.petitions.indent });

            drawParagraph(page2, getVal('defender'), COORDS.defender.x, COORDS.defender.y, { ...opt, maxWidth: COORDS.defender.maxWidth, lineHeight: COORDS.defender.lineHeight, indent: 0 });
            drawParagraph(page2, getVal('witness1'), COORDS.witness1.x, COORDS.witness1.y, { ...opt, maxWidth: COORDS.witness1.maxWidth, lineHeight: COORDS.witness1.lineHeight, indent: 0 });
            drawParagraph(page2, getVal('witness2'), COORDS.witness2.x, COORDS.witness2.y, { ...opt, maxWidth: COORDS.witness2.maxWidth, lineHeight: COORDS.witness2.lineHeight, indent: 0 });
            drawParagraph(page2, getVal('others'), COORDS.others.x, COORDS.others.y, { ...opt, maxWidth: COORDS.others.maxWidth, lineHeight: COORDS.others.lineHeight, indent: 0 });

            const searchVal = document.querySelector('input[name="searchConducted"]:checked').value;
            const searchUl = searchVal === 'yes' ? COORDS.searchUnderline.yes : COORDS.searchUnderline.no;
            page2.drawLine({ start: { x: searchUl.xStart, y: searchUl.y }, end: { x: searchUl.xEnd, y: searchUl.y }, thickness: 1, color: PDFLib.rgb(0, 0, 0) });

            // В PDF пишется ТОЛЬКО номер протокола
            drawParagraph(page2, getVal('searchProtocolSelect'), COORDS.searchProtocol.x, COORDS.searchProtocol.y, { ...opt, maxWidth: COORDS.searchProtocol.maxWidth, lineHeight: COORDS.searchProtocol.lineHeight, indent: 0 });

            drawParagraph(page2, getVal('notes'), COORDS.notes.x, COORDS.notes.y, { ...opt, maxWidth: COORDS.notes.maxWidth, lineHeight: COORDS.notes.lineHeight, indent: COORDS.notes.indent });

            const readUl = COORDS.readUnderline.personally;
            page2.drawLine({ start: { x: readUl.xStart, y: readUl.y }, end: { x: readUl.xEnd, y: readUl.y }, thickness: 1, color: PDFLib.rgb(0, 0, 0) });

            // Блок подписей (только ФИО/инициалы)
            drawCenteredInRange(page2, getVal('detainedFio'), COORDS.signatures.detained.xStart, COORDS.signatures.detained.xEnd, COORDS.signatures.detained.y, opt);
            drawCenteredInRange(page2, getFioOnly(getVal('defender')), COORDS.signatures.defender.xStart, COORDS.signatures.defender.xEnd, COORDS.signatures.defender.y, opt);
            drawCenteredInRange(page2, getFioOnly(getVal('witness1')), COORDS.signatures.witness1.xStart, COORDS.signatures.witness1.xEnd, COORDS.signatures.witness1.y, opt);
            drawCenteredInRange(page2, getFioOnly(getVal('witness2')), COORDS.signatures.witness2.xStart, COORDS.signatures.witness2.xEnd, COORDS.signatures.witness2.y, opt);
            drawCenteredInRange(page2, getVal('officialName'), COORDS.signatures.official.xStart, COORDS.signatures.official.xEnd, COORDS.signatures.official.y, opt);

            drawParagraph(page2, getVal('direction'), COORDS.direction.x, COORDS.direction.y, { ...opt, maxWidth: COORDS.direction.maxWidth, lineHeight: COORDS.direction.lineHeight, indent: COORDS.direction.indent });

            // Сохранение
            const pdfBytes = await pdfDoc.save();
            currentPdfBlob = new Blob([pdfBytes], { type: 'application/pdf' });

            const fileName = `${Date.now()}_DETENTION_${docNumber}.pdf`;

            await supabaseClient.storage.from('documents').upload(fileName, currentPdfBlob, { contentType: 'application/pdf' });
            await supabaseClient.from('documents').insert({
                patient_id: actualCitizenId,
                organization_id: currentOrgId,
                doc_number: docNumber,
                document_type: 'Протокол задержания',
                file_path: fileName,
                status: 'active'
            });

            const fileUrl = URL.createObjectURL(currentPdfBlob);
            document.getElementById('pdf-preview-frame').src = fileUrl + '#' + Date.now();
            document.getElementById('preview-modal').style.display = 'flex';

        } catch (err) {
            console.error(err);
            alert('Ошибка: ' + err.message + '\nУбедись, что файл detention_template.pdf лежит рядом с генератором!');
        } finally {
            btn.disabled = false;
            btn.textContent = 'Сгенерировать и сохранить PDF';
        }
    });

    initDates();
    initTemplates();
    initWorkAutocomplete();
    initArticleAutocomplete();
    loadData();
</script>
</body>
</html>
