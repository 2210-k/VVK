<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>МВД | Ведомость остановок ТС</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        :root {
            --bg: #f3f4f6; --card: #ffffff; --card-hover: #f8fafc;
            --text: #1f2937; --muted: #6b7280; --primary: #1e3a8a;
            --success: #10b981; --danger: #ef4444; --warning: #f59e0b; --border: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
        .title h1 { font-size: 24px; display: flex; align-items: center; gap: 10px; color: var(--primary); }
        .actions { display: flex; gap: 10px; }
        .btn { padding: 10px 16px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: 0.2s; font-size: 14px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: #152d6e; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-secondary { background: white; color: var(--text); border: 1px solid var(--border); }
        .btn-secondary:hover { background: #f9fafb; }
        .btn-sm { padding: 6px 12px; font-size: 12px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .tab { padding: 10px 20px; cursor: pointer; font-weight: 600; color: var(--muted); border-radius: 8px 8px 0 0; transition: 0.2s; }
        .tab.active { color: var(--primary); background: rgba(30,58,138,0.05); border-bottom: 2px solid var(--primary); }
        .table-wrap { background: var(--card); border-radius: 12px; overflow-x: auto; border: 1px solid var(--border); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th, td { padding: 14px; text-align: left; border-bottom: 1px solid var(--border); font-size: 13px; }
        th { color: var(--muted); font-weight: 600; text-transform: uppercase; font-size: 11px; background: #f8fafc; }
        tbody tr { cursor: pointer; transition: 0.2s; }
        tbody tr:hover { background: var(--card-hover); }
        .badge { padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; }
        .badge-open { background: rgba(16,185,129,0.15); color: #047857; }
        .badge-closed { background: rgba(239,68,68,0.15); color: #b91c1c; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; padding: 15px; backdrop-filter: blur(4px); }
        .modal.active { display: flex; }
        .modal-content { background: var(--card); border-radius: 16px; width: 100%; max-width: 800px; max-height: 90vh; overflow-y: auto; border: 1px solid var(--border); box-shadow: 0 20px 50px rgba(0,0,0,0.2); }
        .modal-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: var(--card); z-index: 10; border-radius: 16px 16px 0 0; }
        .modal-header h2 { font-size: 18px; color: var(--primary); }
        .modal-close { background: none; border: none; color: var(--muted); font-size: 24px; cursor: pointer; }
        .modal-body { padding: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
        .form-control { width: 100%; padding: 12px; background: #f9fafb; border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: inherit; font-size: 14px; outline: none; }
        .form-control:focus { border-color: var(--primary); background: white; }
        .form-select { width: 100%; padding: 12px; background: #f9fafb; border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: inherit; font-size: 14px; outline: none; cursor: pointer; font-weight: bold; }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid var(--border); }
        .info-item label { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; margin-bottom: 4px; font-weight: 600; }
        .info-item div { font-size: 14px; font-weight: 500; color: var(--text); }
        .action-list { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .action-card { background: white; border: 1px solid var(--border); border-radius: 8px; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .action-card:hover { border-color: var(--primary); }
        .action-info h4 { font-size: 14px; margin-bottom: 4px; color: var(--primary); }
        .action-info p { font-size: 12px; color: var(--muted); }
        .action-buttons { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
        .empty { text-align: center; padding: 40px; color: var(--muted); }
        .toast { position: fixed; bottom: 20px; right: 20px; padding: 15px 25px; border-radius: 8px; background: var(--success); color: white; font-weight: 600; transform: translateY(100px); opacity: 0; transition: 0.3s; z-index: 2000; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.error { background: var(--danger); }
    </style>
</head>
<body>

    <div class="header">
        <div class="title"><h1><i class="fa-solid fa-shield-halved"></i> Ведомость остановок ТС (МВД)</h1></div>
        <div class="actions">
            <button class="btn btn-secondary" onclick="window.location.href='index.html'"><i class="fa-solid fa-arrow-left"></i> В портал</button>
            <button class="btn btn-primary" onclick="openStopModal()"><i class="fa-solid fa-car"></i> Остановить ТС</button>
        </div>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('stops', this)">Журнал остановок</div>
        <div class="tab" onclick="switchTab('vehicles', this)">Все ТС</div>
    </div>

    <div id="tab-stops">
        <div class="table-wrap">
            <table>
                <thead><tr>
                    <th>Номер / Дата</th><th>Водитель</th><th>ТС / Госномер</th><th>Причина</th><th>Действия</th><th>Статус</th>
                </tr></thead>
                <tbody id="stops-table-body"></tbody>
            </table>
        </div>
    </div>

    <div id="tab-vehicles" style="display: none;">
        <div class="table-wrap">
            <table>
                <thead><tr>
                    <th>Номер документа</th><th>Владелец</th><th>ТС</th><th>Госномер</th><th>Цвет</th><th>Действия</th>
                </tr></thead>
                <tbody id="vehicles-table-body"></tbody>
            </table>
        </div>
    </div>

    <!-- МОДАЛКА: СОЗДАНИЕ ОСТАНОВКИ -->
    <div class="modal" id="create-stop-modal">
        <div class="modal-content">
            <div class="modal-header"><h2>Новая остановка ТС</h2><button class="modal-close" onclick="closeModal('create-stop-modal')">&times;</button></div>
            <div class="modal-body">
                <form id="create-stop-form">
                    <div class="form-group">
                        <label>Водитель (Гражданин)</label>
                        <select class="form-select" id="stop-patient" required onchange="onPatientSelect()">
                            <option value="">-- Выберите гражданина --</option>
                        </select>
                    </div>
                    <div class="row">
                        <div class="form-group">
                            <label>Сотрудник (Должность, звание)</label>
                            <select class="form-select" id="stop-template-official" style="margin-bottom:5px;" onchange="document.getElementById('stop-inspector-pos').value = this.value">
                                <option value="">-- Шаблон --</option>
                                <option value="инспектор ДПС УМВД России по Оренбургской области, генерал полиции">инспектор ДПС УМВД России по Оренбургской области, генерал полиции</option>
                            </select>
                            <input type="text" class="form-control" id="stop-inspector-pos" placeholder="Должность и звание" required>
                        </div>
                        <div class="form-group">
                            <label>ФИО сотрудника</label>
                            <input type="text" class="form-control" id="stop-inspector-name" placeholder="Иванов Иван Иванович" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="form-group">
                            <label>Транспортное средство</label>
                            <select class="form-control" id="stop-vehicle-doc" required onchange="onVehicleSelect()">
                                <option value="">-- Сначала выберите водителя --</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Номер документа на ТС</label>
                            <input type="text" class="form-control" id="stop-vehicle-doc-num" required readonly>
                        </div>
                    </div>
                    <div class="row">
                        <div class="form-group">
                            <label>Госномер</label>
                            <input type="text" class="form-control" id="stop-plate" required readonly>
                        </div>
                        <div class="form-group">
                            <label>Цвет</label>
                            <input type="text" class="form-control" id="stop-color" required readonly>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Причина остановки</label>
                        <select class="form-select" id="stop-reason" required>
                            <option value="0.1">0.1 — Проверка документов на право пользования и управления ТС</option>
                            <option value="0.2">0.2 — Нарушение Правил дорожного движения (ДК РФ)</option>
                            <option value="0.3">0.3 — Наличие ориентировки (розыск ТС или водителя)</option>
                            <option value="0.4">0.4 — Проведение специальных мероприятий (рейд, перекрытие)</option>
                            <option value="0.5">0.5 — Проверка технического состояния ТС (неисправность)</option>
                            <option value="0.6">0.6 — Участие водителя в ДТП или как свидетеля</option>
                            <option value="0.7">0.7 — Подозрение на совершение преступления</option>
                            <option value="0.8">0.8 — Нахождение лица в розыске</option>
                            <option value="0.9">0.9 — Иная причина, требующая вмешательства полиции</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Фактический адрес проживания</label>
                        <select class="form-select" id="stop-template-actual" style="margin-bottom:5px;" onchange="onActualAddressSelect()">
                            <option value="">-- Шаблон --</option>
                            <option value="__SAME__">Такой же, как адрес регистрации</option>
                            <option value="Не имеет">Не имеет</option>
                        </select>
                        <input type="text" class="form-control" id="stop-actual-address">
                    </div>
                    <div class="form-group">
                        <label>Результат остановки</label>
                        <textarea class="form-control" id="stop-result" rows="2" placeholder="Проверен, нарушений не выявлено..."></textarea>
                    </div>
                    <div class="row">
                        <div class="form-group">
                            <label>Реальная дата</label>
                            <input type="date" class="form-control" id="stop-date" required>
                        </div>
                        <div class="form-group">
                            <label>Игровой день</label>
                            <input type="number" class="form-control" id="stop-game-day" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 10px;">Создать запись</button>
                </form>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА: КАРТОЧКА ОСТАНОВКИ -->
    <div class="modal" id="detail-stop-modal">
        <div class="modal-content" style="max-width: 900px;">
            <div class="modal-header"><h2>Карточка остановки</h2><button class="modal-close" onclick="closeModal('detail-stop-modal')">&times;</button></div>
            <div class="modal-body"><div id="detail-stop-content"></div></div>
        </div>
    </div>

    <!-- МОДАЛКА: ПРОСМОТР PDF -->
    <div class="modal" id="preview-modal" style="z-index: 2000;">
        <div class="modal-content" style="max-width: 95%; width: 95%; height: 95%; display: flex; flex-direction: column;">
            <div class="modal-header">
                <h2>Просмотр документа</h2>
                <div style="display:flex; gap:10px; align-items:center;">
                    <a id="preview-download-btn" href="#" class="btn btn-primary" download>Скачать</a>
                    <button class="modal-close" onclick="closeModal('preview-modal')" style="margin-top:-5px;">&times;</button>
                </div>
            </div>
            <div class="modal-body" id="pdf-container" style="flex:1; overflow-y:auto; background:#555; padding:10px; display:flex; flex-direction:column; align-items:center; gap:10px;"></div>
        </div>
    </div>

    <div class="toast" id="toast">Успешно</div>

<script>
    const SUPABASE_URL = 'https://omnrekfdjurrfzrwfzzn.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_v0z_8kT0ZmFH1uPiamR60w_vDNsIfKg';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    let allCitizens = [], allVehicles = [], allStops = [];
    let currentDay = 1, currentStopId = null;

    const REASON_MAP = {
        '0.1': 'Проверка документов на право пользования и управления ТС',
        '0.2': 'Нарушение Правил дорожного движения (ДК РФ)',
        '0.3': 'Наличие ориентировки (розыск ТС или водителя)',
        '0.4': 'Проведение специальных мероприятий (рейд, перекрытие)',
        '0.5': 'Проверка технического состояния ТС (неисправность)',
        '0.6': 'Участие водителя в ДТП или как свидетеля',
        '0.7': 'Подозрение на совершение преступления',
        '0.8': 'Нахождение лица в розыске',
        '0.9': 'Иная причина, требующая вмешательства полиции'
    };

    function showToast(msg, isError = false) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.className = 'toast show ' + (isError ? 'error' : '');
        setTimeout(() => t.classList.remove('show'), 3000);
    }

    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    function openStopModal() {
        document.getElementById('create-stop-form').reset();
        document.getElementById('stop-game-day').value = currentDay;
        document.getElementById('stop-date').value = new Date().toISOString().split('T')[0];
        document.getElementById('stop-vehicle-doc').innerHTML = '<option value="">-- Сначала выберите водителя --</option>';
        document.getElementById('stop-vehicle-doc-num').value = '';
        document.getElementById('stop-plate').value = '';
        document.getElementById('stop-color').value = '';
        openModal('create-stop-modal');
    }

    async function init() {
        const { data: settings } = await supabaseClient.from('app_settings').select('current_day').eq('id', 1).maybeSingle();
        if (settings) currentDay = settings.current_day;
        await loadCitizens();
        await loadVehicles();
        await loadStops();
        // Обновляем список при возврате вкладки (после генерации протокола)
        window.addEventListener('focus', () => loadStops());
    }

    async function loadCitizens() {
        const { data } = await supabaseClient.from('profiles').select('*').eq('role', 'patient').order('last_name');
        allCitizens = data || [];
        const select = document.getElementById('stop-patient');
        select.innerHTML = '<option value="">-- Выберите гражданина --</option>';
        allCitizens.forEach(c => select.add(new Option(`${c.last_name} ${c.first_name} ${c.patronymic || ''}`.trim(), c.id)));
    }

    async function loadVehicles() {
        const { data } = await supabaseClient.from('documents')
            .select('*, profiles(last_name, first_name)')
            .in('document_type', ['Договор аренды ТС', 'Паспорт ТС'])
            .eq('status', 'active');
        allVehicles = data || [];
        const tbody = document.getElementById('vehicles-table-body');
        tbody.innerHTML = '';
        if (!allVehicles.length) tbody.innerHTML = '<tr><td colspan="6" class="empty">Нет зарегистрированных ТС</td></tr>';
        allVehicles.forEach(v => {
            const owner = v.profiles ? `${v.profiles.last_name} ${v.profiles.first_name}` : 'В архиве';
            tbody.innerHTML += `
                <tr>
                    <td><b>${v.doc_number}</b></td><td>${owner}</td>
                    <td>${v.metadata?.vehicle_name || '—'}</td>
                    <td>${v.metadata?.plate || '—'}</td>
                    <td>${v.metadata?.color || '—'}</td>
                    <td><button class="btn btn-sm btn-secondary" onclick="findAndPreviewDoc('${v.doc_number}')">Документ</button></td>
                </tr>`;
        });
    }

    async function loadStops() {
        const { data, error } = await supabaseClient.from('mvd_stops').select('*, profiles(*)').order('created_at', { ascending: false });
        if (error) return showToast(error.message, true);
        allStops = data || [];
        const { data: docs } = await supabaseClient.from('documents').select('stop_id').not('stop_id', 'is', null);
        const actionCounts = {};
        if (docs) docs.forEach(d => actionCounts[d.stop_id] = (actionCounts[d.stop_id] || 0) + 1);
        allStops.forEach(s => s.actions_count = actionCounts[s.id] || 0);
        renderStops();
    }

    function renderStops() {
        const tbody = document.getElementById('stops-table-body');
        tbody.innerHTML = '';
        if (!allStops.length) { tbody.innerHTML = '<tr><td colspan="6" class="empty">Журнал остановок пуст</td></tr>'; return; }
        allStops.forEach(s => {
            const p = s.profiles || {};
            const fio = `${p.last_name || ''} ${p.first_name || ''} ${p.patronymic || ''}`.trim() || 'Неизвестен';
            const statusBadge = s.status === 'open'
                ? '<span class="badge badge-open">Открыта</span>'
                : '<span class="badge badge-closed">Закрыта</span>';
            tbody.innerHTML += `
                <tr onclick="openStopDetails(${s.id})">
                    <td><div style="font-weight:bold; color:var(--primary);">${s.doc_number}</div><div style="font-size:11px; color:var(--muted);">${new Date(s.created_at).toLocaleDateString()}</div></td>
                    <td>${fio}</td>
                    <td><div>${s.vehicle_model}</div><div style="font-size:11px; color:var(--warning);">${s.vehicle_plate}</div></td>
                    <td><div>${s.reason_code}</div><div style="font-size:11px; color:var(--muted);">${REASON_MAP[s.reason_code] || '—'}</div></td>
                    <td><span style="color:var(--primary); font-weight:bold;">${s.actions_count}</span></td>
                    <td>${statusBadge}</td>
                </tr>`;
        });
    }

    function onPatientSelect() {
        const pid = document.getElementById('stop-patient').value;
        const vehicleSelect = document.getElementById('stop-vehicle-doc');
        vehicleSelect.innerHTML = '<option value="">-- Выберите ТС --</option>';
        if (!pid) return;
        const vehicles = allVehicles.filter(v => v.patient_id === pid);
        if (!vehicles.length) { vehicleSelect.innerHTML = '<option value="">Нет активных ТС</option>'; return; }
        vehicles.forEach(v => vehicleSelect.add(new Option(`${v.metadata?.vehicle_name || 'ТС'} (${v.metadata?.plate || 'Б/Н'})`, v.id)));
    }

    function onVehicleSelect() {
        const v = allVehicles.find(x => x.id == document.getElementById('stop-vehicle-doc').value);
        if (!v) return;
        document.getElementById('stop-vehicle-doc-num').value = v.doc_number;
        document.getElementById('stop-plate').value = v.metadata?.plate || '';
        document.getElementById('stop-color').value = v.metadata?.color || '';
    }

    function onActualAddressSelect() {
        const val = document.getElementById('stop-template-actual').value;
        const p = allCitizens.find(c => c.id === document.getElementById('stop-patient').value);
        if (val === '__SAME__' && p) document.getElementById('stop-actual-address').value = p.address || '';
        else if (val) document.getElementById('stop-actual-address').value = val;
    }

    document.getElementById('create-stop-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = e.target.querySelector('button[type="submit"]');
        btn.disabled = true; btn.textContent = 'Создание...';
        const v = allVehicles.find(x => x.id == document.getElementById('stop-vehicle-doc').value);
        const payload = {
            doc_number: `0154${String(Math.floor(Math.random() * 999)).padStart(3, '0')}`,
            patient_id: document.getElementById('stop-patient').value,
            inspector_position: document.getElementById('stop-inspector-pos').value,
            inspector_name: document.getElementById('stop-inspector-name').value,
            vehicle_model: v.metadata?.vehicle_name || 'Неизвестно',
            vehicle_plate: document.getElementById('stop-plate').value,
            vehicle_color: document.getElementById('stop-color').value,
            vehicle_doc_number: document.getElementById('stop-vehicle-doc-num').value,
            reason_code: document.getElementById('stop-reason').value,
            actual_address: document.getElementById('stop-actual-address').value,
            result: document.getElementById('stop-result').value,
            real_date: document.getElementById('stop-date').value,
            game_day: parseInt(document.getElementById('stop-game-day').value),
            status: 'open'
        };
        const { error } = await supabaseClient.from('mvd_stops').insert(payload);
        btn.disabled = false; btn.textContent = 'Создать запись';
        if (error) return showToast(error.message, true);
        showToast('Остановка зафиксирована');
        closeModal('create-stop-modal');
        loadStops();
    });

    async function openStopDetails(id) {
        currentStopId = id;
        const stop = allStops.find(s => s.id === id);
        if (!stop) return;
        const p = stop.profiles || {};
        const fio = `${p.last_name || ''} ${p.first_name || ''} ${p.patronymic || ''}`.trim();
        const { data: actions } = await supabaseClient.from('documents').select('*').eq('stop_id', id).order('created_at', { ascending: false });
        const isClosed = stop.status === 'closed';

        let html = `
            <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:20px;">
                <div>
                    <h3 style="color:var(--primary); font-size:20px;">Остановка № ${stop.doc_number}</h3>
                    <p style="color:var(--muted); font-size:12px; margin-top:5px;">Дата: ${new Date(stop.created_at).toLocaleString()} (День ${stop.game_day})</p>
                </div>
                <div>${isClosed ? '<span class="badge badge-closed" style="font-size:14px; padding:8px 12px;">Закрыта</span>' : '<span class="badge badge-open" style="font-size:14px; padding:8px 12px;">Открыта</span>'}</div>
            </div>
            <div class="info-grid">
                <div class="info-item"><label>Водитель</label><div>${fio || 'Неизвестен'}</div></div>
                <div class="info-item"><label>Причина остановки</label><div>${stop.reason_code} — ${REASON_MAP[stop.reason_code]}</div></div>
                <div class="info-item"><label>ТС</label><div>${stop.vehicle_model} / ${stop.vehicle_color}</div></div>
                <div class="info-item"><label>Госномер</label><div style="color:var(--warning); font-weight:bold;">${stop.vehicle_plate}</div></div>
                <div class="info-item"><label>Документ на ТС</label><div>${stop.vehicle_doc_number}</div></div>
                <div class="info-item"><label>Сотрудник</label><div>${stop.inspector_position}, ${stop.inspector_name}</div></div>
                <div class="info-item" style="grid-column:1/-1"><label>Результат</label><div>${stop.result || '—'}</div></div>
            </div>`;

        if (!isClosed) {
            html += `
                <div class="action-buttons">
                    <button class="btn btn-primary" onclick="addAction('generator-admin-order.html')"><i class="fa-solid fa-file-contract"></i> Постановление</button>
                    <button class="btn btn-primary" onclick="addAction('generator-detention.html')"><i class="fa-solid fa-handcuffs"></i> Задержание</button>
                    <button class="btn btn-primary" onclick="addAction('generator-protocol-search.html')"><i class="fa-solid fa-magnifying-glass"></i> Обыск</button>
                    <button class="btn btn-danger" style="margin-left:auto;" onclick="closeStop(${stop.id})" title="Откроется генератор протокола"><i class="fa-solid fa-lock"></i> Закрыть остановку</button>
                </div>`;
        }

        html += `<h3 style="margin-bottom:10px; font-size:16px; margin-top:20px;">Процессуальные действия (${actions ? actions.length : 0})</h3>`;
        if (!actions || !actions.length) html += `<div class="empty">Нет прикрепленных действий</div>`;
        else {
            html += `<div class="action-list">`;
            actions.forEach(a => {
                const { data: { publicUrl } } = supabaseClient.storage.from('documents').getPublicUrl(a.file_path);
                html += `
                    <div class="action-card">
                        <div class="action-info">
                            <h4>${a.document_type} № ${a.doc_number}</h4>
                            <p>Статус: <b>${a.status === 'active' ? 'Активен' : (a.status === 'revoked' ? 'Аннулирован' : a.status)}</b></p>
                        </div>
                        <div style="display:flex; gap:5px;">
                            <button class="btn btn-sm btn-secondary" onclick="previewDoc('${publicUrl}')">Просмотр</button>
                            ${!isClosed && a.status === 'active' ? `<button class="btn btn-sm btn-danger" onclick="revokeAction(${a.id})">Аннулировать</button>` : ''}
                        </div>
                    </div>`;
            });
            html += `</div>`;
        }

        document.getElementById('detail-stop-content').innerHTML = html;
        openModal('detail-stop-modal');
    }

    function addAction(url) {
        const stop = allStops.find(s => s.id === currentStopId);
        if (!stop) return;
        window.open(`${url}?org=2&stop_id=${stop.id}&patient_id=${stop.patient_id}&t=${Date.now()}`, '_blank');
    }

    // ⬇️ ИЗМЕНЕНО: открывает генератор вместо генерации PDF
    function closeStop(id) {
        if (!confirm('Открыть генератор протокола? После генерации остановка будет закрыта.')) return;
        window.open(`generator-stop-protocol.html?stop_id=${id}&t=${Date.now()}`, '_blank');
    }

    async function revokeAction(docId) {
        if (!confirm('Аннулировать этот документ?')) return;
        await supabaseClient.from('documents').update({ status: 'revoked' }).eq('id', docId);
        openStopDetails(currentStopId);
    }

    async function previewDoc(url) {
        document.getElementById('preview-download-btn').href = url;
        const container = document.getElementById('pdf-container');
        container.innerHTML = '<p style="color:white;">Загрузка...</p>';
        openModal('preview-modal');
        try {
            const loadingTask = pdfjsLib.getDocument(url);
            const pdf = await loadingTask.promise;
            container.innerHTML = '';
            const containerWidth = container.clientWidth;
            const pixelRatio = window.devicePixelRatio || 1;
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const viewport = page.getViewport({ scale: 1 });
                const scale = (containerWidth / viewport.width) * pixelRatio * 1.2;
                const scaledViewport = page.getViewport({ scale: scale });
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.height = scaledViewport.height;
                canvas.width = scaledViewport.width;
                canvas.style.width = '100%';
                canvas.style.height = 'auto';
                canvas.style.marginBottom = '10px';
                canvas.style.boxShadow = '0 2px 10px rgba(0,0,0,0.3)';
                container.appendChild(canvas);
                await page.render({ canvasContext: context, viewport: scaledViewport }).promise;
            }
        } catch (err) {
            container.innerHTML = '<p style="color:white;">Ошибка загрузки PDF: ' + err.message + '</p>';
        }
    }

    async function findAndPreviewDoc(docNumber) {
        const { data } = await supabaseClient.from('documents').select('file_path').eq('doc_number', docNumber).maybeSingle();
        if (data) {
            const { data: { publicUrl } } = supabaseClient.storage.from('documents').getPublicUrl(data.file_path);
            previewDoc(publicUrl);
        }
    }

    function switchTab(tab, el) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        document.getElementById('tab-stops').style.display = tab === 'stops' ? 'block' : 'none';
        document.getElementById('tab-vehicles').style.display = tab === 'vehicles' ? 'block' : 'none';
    }

    init();
</script>
</body>
</html>
