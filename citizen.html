<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои документы</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background: #f0fdf4; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        #auth-screen { display: flex; justify-content: center; align-items: center; height: 90vh; }
        .auth-box { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        .auth-box input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 4px; font-weight: bold; background: #10b981; color: white; cursor: pointer; }
        #dashboard-screen { display: none; }
        .header { display: flex; justify-content: space-between; border-bottom: 2px solid #10b981; padding-bottom: 15px; margin-bottom: 20px; }
        .doc-card { border: 1px solid #ddd; padding: 15px; margin-bottom: 10px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
        .btn-dl { background: #10b981; color: white; padding: 8px 15px; text-decoration: none; border-radius: 4px; font-weight: bold; }
        .error-msg { color: red; display: none; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div id="auth-screen">
        <div class="auth-box">
            <h2>Кабинет пациента</h2>
            <div id="auth-error" class="error-msg"></div>
            <form id="login-form">
                <input type="email" id="email" placeholder="Email" required>
                <input type="password" id="password" placeholder="Пароль" required>
                <button type="submit" class="btn">Войти</button>
            </form>
            <a href="index.html" style="display:block; margin-top:15px; color:#666;">Вход для врачей</a>
        </div>
    </div>

    <div id="dashboard-screen" class="container">
        <div class="header">
            <h2>Мои документы</h2>
            <button id="logout-btn" style="background:none; border:1px solid red; color:red; padding:5px 10px; cursor:pointer;">Выйти</button>
        </div>
        <div id="docs-list">Загрузка...</div>
    </div>

    <script>
        const supabaseClient = supabase.createClient('https://omnrekfdjurrfzrwfzzn.supabase.co', 'sb_publishable_v0z_8kT0ZmFH1uPiamR60w_vDNsIfKg');

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const { error } = await supabaseClient.auth.signInWithPassword({
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            });
            if (error) {
                document.getElementById('auth-error').textContent = error.message;
                document.getElementById('auth-error').style.display = 'block';
            }
        });

        document.getElementById('logout-btn').addEventListener('click', () => supabaseClient.auth.signOut());

        supabaseClient.auth.onAuthStateChange(async (event, session) => {
            if (session) {
                // Если это админ, не пускаем сюда
                const { data: profile } = await supabaseClient.from('profiles').select('role').eq('id', session.user.id).single();
                if (profile && profile.role === 'admin') {
                    window.location.href = 'index.html';
                    return;
                }

                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('dashboard-screen').style.display = 'block';
                loadMyDocs(session.user.id);
            } else {
                document.getElementById('auth-screen').style.display = 'flex';
                document.getElementById('dashboard-screen').style.display = 'none';
            }
        });

        async function loadMyDocs(userId) {
            const list = document.getElementById('docs-list');
            list.innerHTML = '<p>Загрузка...</p>';

            // Ищем документы, где patient_id равен ID текущего пользователя
            const { data: docs, error } = await supabaseClient
                .from('documents')
                .select('*')
                .eq('patient_id', userId)
                .order('created_at', { ascending: false });

            if (error) {
                list.innerHTML = '<p style="color:red">Ошибка: ' + error.message + '</p>';
                return;
            }
            if (docs.length === 0) {
                list.innerHTML = '<p>У вас пока нет документов.</p>';
                return;
            }

            list.innerHTML = '';
            docs.forEach(doc => {
                const { data: { publicUrl } } = supabaseClient.storage.from('documents').getPublicUrl(doc.file_path);
                list.innerHTML += `
                    <div class="doc-card">
                        <div>
                            <h4>${doc.document_type}</h4>
                            <p>Номер: <b>${doc.doc_number}</b> | Дата: ${new Date(doc.created_at).toLocaleDateString()}</p>
                        </div>
                        <a href="${publicUrl}" target="_blank" class="btn-dl">Скачать PDF</a>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
