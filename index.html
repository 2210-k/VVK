<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заполнение заключения ВВК</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input[type="text"], textarea, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        textarea { resize: vertical; height: 80px; }
        select { background-color: #eef5ff; font-weight: bold; margin-bottom: 5px; cursor: pointer; }
        .radio-group { display: flex; gap: 15px; margin-top: 5px; }
        .radio-group label { font-weight: normal; display: flex; align-items: center; gap: 5px; cursor: pointer; }
        button[type="submit"] { background: #0056b3; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 20px; }
        button[type="submit"]:hover { background: #004494; }
        button[type="submit"]:disabled { background: #ccc; cursor: not-allowed; }
        .row { display: flex; gap: 15px; }
        .row > .form-group { flex: 1; }
        .date-group { display: flex; gap: 5px; }
        .date-group input, .center-input { text-align: center; }
        .date-group .day { width: 60px; }
        .date-group .month { width: 80px; }
        .date-group .year { width: 80px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Заполнение заключения ВВК</h2>
    <form id="vvkForm">
        
        <div class="row">
            <div class="form-group">
                <label>Дата заключения (Авто-заполнение)</label>
                <div class="date-group">
                    <input type="text" id="dateDay" class="day" maxlength="2" required>
                    <input type="text" id="dateMonth" class="month" maxlength="2" required>
                    <input type="text" id="dateYear" class="year" maxlength="4" required>
                </div>
            </div>
            <div class="form-group">
                <label>№ документа (редактируемый)</label>
                <input type="text" id="docNumber" class="center-input" required>
            </div>
        </div>

        <div class="form-group">
            <label>Председатель комиссии (должность, звание, инициалы)</label>
            <input type="text" id="chairman" required>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Имя</label>
                <input type="text" id="firstName" required>
            </div>
            <div class="form-group">
                <label>Отчество</label>
                <input type="text" id="patronymic" required>
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Дата рождения (20__ уже в бланке)</label>
                <div class="date-group">
                    <input type="text" id="dobDay" class="day" placeholder="ДД" maxlength="2" required>
                    <input type="text" id="dobMonth" class="month" placeholder="ММ" maxlength="2" required>
                    <input type="text" id="dobYear" class="year" placeholder="ГГ" maxlength="2" required>
                </div>
            </div>
            <div class="form-group">
                <label>Место рождения</label>
                <input type="text" id="pob" required>
            </div>
        </div>

        <div class="form-group">
            <label>Адрес регистрации</label>
            <input type="text" id="address" required>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Паспорт (Серия)</label>
                <input type="text" id="passSeries" class="center-input" maxlength="4" required>
            </div>
            <div class="form-group">
                <label>Паспорт (Номер)</label>
                <input type="text" id="passNumber" class="center-input" maxlength="6" required>
            </div>
            <div class="form-group">
                <label>№ повестки</label>
                <input type="text" id="summons" class="center-input" required>
            </div>
        </div>

        <div class="form-group">
            <label>Жалобы</label>
            <select id="template-complaints"><option value="">-- Выбрать шаблон --</option></select>
            <textarea id="complaints"></textarea>
        </div>

        <div class="form-group">
            <label>Анамнез</label>
            <select id="template-anamnesis"><option value="">-- Выбрать шаблон --</option></select>
            <textarea id="anamnesis"></textarea>
        </div>

        <div class="form-group">
            <label>Данные объективного обследования</label>
            <select id="template-objectiveData"><option value="">-- Выбрать шаблон --</option></select>
            <textarea id="objectiveData"></textarea>
        </div>

        <div class="form-group">
            <label>Диагноз</label>
            <select id="template-diagnosis"><option value="">-- Выбрать шаблон --</option></select>
            <textarea id="diagnosis"></textarea>
        </div>

        <div class="form-group">
            <label>Категория годности</label>
            <div class="radio-group">
                <label><input type="radio" name="category" value="A" required> А</label>
                <label><input type="radio" name="category" value="B"> Б</label>
                <label><input type="radio" name="category" value="V"> В</label>
                <label><input type="radio" name="category" value="G"> Г</label>
                <label><input type="radio" name="category" value="D"> Д</label>
            </div>
        </div>

        <div class="form-group">
            <label>Рекомендации комиссии</label>
            <select id="template-recommendations"><option value="">-- Выбрать шаблон --</option></select>
            <textarea id="recommendations"></textarea>
        </div>

        <button type="submit" id="submitBtn">Скачать заполненный PDF</button>
    </form>
</div>

<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://unpkg.com/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>

<script>
    // =====================================================================
    // ⚙️ ВАШИ КООРДИНАТЫ (Я вернул всё как было. xStart и xEnd - для центрирования) ⚙️
    // =====================================================================
    const COORDS = {
        // Для центрируемых полей пишем xStart (начало) и xEnd (конец поля)
        date: { 
            day: { xStart: 50, xEnd: 65, y: 665 }, 
            month: { xStart: 77, xEnd: 163, y: 665 }, 
            year: { xStart: 177, xEnd: 213, y: 665 } 
        },
        docNumber: { xStart: 510, xEnd: 546, y: 665 },
        
        // Обычные поля (только x - левый край)
        chairman: { x: 172, y: 632 },
        firstName: { x: 74, y: 561 },
        patronymic: { x: 354, y: 561 },
        
        // Центрируемые поля (Дата рождения)
        dob: { 
            day: { xStart: 138, xEnd: 153, y: 547 }, 
            month: { xStart: 161, xEnd: 235, y: 547 }, 
            year: { xStart: 251, xEnd: 263, y: 547 } 
        },
        
        pob: { x: 387, y: 548 },
        address: { x: 147, y: 533 },
        
        // Центрируемые поля (Паспорт и повестка)
        passSeries: { xStart: 128, xEnd: 155, y: 520 },
        passNumber: { xStart: 178, xEnd: 227, y: 520 },
        summons: { xStart: 363, xEnd: 404, y: 520 },
        
        // МНОГОСТРОЧНЫЕ ПОЛЯ (Замените строку "ВПИШИ_Y" на ваши координаты по высоте)
        complaints: { x: 50, y: 516, maxWidth: 492, indent: 43 }, 
        anamnesis: { x: 50, y: 488, maxWidth: 492, indent: 46 },
        objectiveData: { x: 50, y: 447, maxWidth: 492, indent: 181 },
        diagnosis: { x: 50, y: 448, maxWidth: 492, indent: 43 },
        recommendations: { x: 50, y: 268, maxWidth: 492, indent: 120 },

        categories: {
            'A': { x: 50, y: 332 },
            'B': { x: 50, y: 318 },
            'V': { x: 50, y: 305 },
            'G': { x: 50, y: 291 },
            'D': { x: 50, y: 277.5 }
        }
    };

    const TEMPLATES = {
        complaints: ["Жалоб не предъявляет.", "Жалобы на головные боли, быструю утомляемость, боли в области сердца, одышку.", "Жалобы на периодические боли в пояснице, ограничение подвижности."],
        anamnesis: ["Ранее перенесённые заболевания: не переносил. Хронических заболеваний не выявлено. Травм, операций не было. На учёте у врачей не состоит.", "Ранее перенесённые заболевания: ОРВИ, ангина, пневмония. Хронических заболеваний не выявлено. Травм, операций не было. На учёте у врачей не состоит.", "Ранее перенесённые заболевания: ОРВИ. Хронические заболевания: [название]. Состоит на учёте у [специалист] с [год]. Регулярно наблюдается.", "Ранее перенесённые заболевания: ОРВИ. Травмы: перелом левой голени в 2026 г. Операции: [перечислить]. Хронических заболеваний не выявлено."],
        objectiveData: ["Общее состояние удовлетворительное. Кожные покровы чистые, обычной окраски. Дыхание везикулярное, хрипов нет. Тоны сердца ясные, ритмичные. АД 120/80 мм рт.ст., пульс 72 уд/мин. Живот мягкий, безболезненный. Физическое развитие соответствует возрасту.", "Общее состояние удовлетворительное. Кожные покровы чистые. Дыхание везикулярное, хрипов нет. Тоны сердца ясные, ритмичные. АД [указать] мм рт.ст., пульс [указать] уд/мин. Живот мягкий, безболезненный. [Указать отклонения]."],
        diagnosis: ["Практически здоров.", "Гипертоническая болезнь I стадии.", "Последствия перенесённой травмы [название]. Без нарушения функций."],
        recommendations: ["Годен к военной службе без ограничений.", "Годен с незначительными ограничениями. Рекомендовано: служба в частях, не связанных с повышенными физическими нагрузками.", "Временно не годен. Рекомендована отсрочка на [срок]. Повторное освидетельствование через [срок].", "Не годен к военной службе. Освобождается от воинской обязанности."]
    };

    function initTemplates() {
        for (const [fieldId, options] of Object.entries(TEMPLATES)) {
            const select = document.getElementById(`template-${fieldId}`);
            const textarea = document.getElementById(fieldId);
            options.forEach((text, index) => {
                const opt = document.createElement('option');
                opt.value = text;
                opt.textContent = `Вариант ${index + 1}`;
                select.appendChild(opt);
            });
            select.addEventListener('change', (e) => { if (e.target.value) textarea.value = e.target.value; });
        }
    }

    function initAutoDate() {
        const today = new Date();
        document.getElementById('dateDay').value = String(today.getDate()).padStart(2, '0');
        document.getElementById('dateMonth').value = String(today.getMonth() + 1).padStart(2, '0');
        document.getElementById('dateYear').value = today.getFullYear();
        document.getElementById('docNumber').value = Math.floor(1000 + Math.random() * 9000);
    }

    initTemplates();
    initAutoDate();

    // =====================================================================
    // 🎨 ФУНКЦИИ РИСОВАНИЯ
    // =====================================================================
    
    // НОВАЯ ФУНКЦИЯ: Центрирование по НАЧАЛУ и КОНЦУ поля
    function drawCenteredInRange(page, text, xStart, xEnd, y, options) {
        if (!text) return;
        const textWidth = options.font.widthOfTextAtSize(text, options.size);
        
        // Вычисляем точку старта, чтобы текст оказался ровно посередине между xStart и xEnd
        const fieldWidth = xEnd - xStart;
        const startX = xStart + (fieldWidth - textWidth) / 2;
        
        page.drawText(text, { ...options, x: startX, y });
    }

    function drawParagraph(page, text, x, y, options) {
        if (!text || y === "ВПИШИ_Y") return; // Защита от забытых координат
        const { font, size, color, maxWidth, lineHeight, indent } = options;
        const words = text.split(' ');
        let lines = [];
        let currentLine = '';
        let isFirstLine = true;

        for (let word of words) {
            const availableWidth = isFirstLine ? (maxWidth - indent) : maxWidth;
            const testLine = currentLine === '' ? word : currentLine + ' ' + word;
            if (font.widthOfTextAtSize(testLine, size) <= availableWidth) {
                currentLine = testLine;
            } else {
                lines.push({ text: currentLine, isFirst: isFirstLine });
                currentLine = word;
                isFirstLine = false;
            }
        }
        if (currentLine !== '') lines.push({ text: currentLine, isFirst: isFirstLine });

        let currentY = y;
        for (let line of lines) {
            const currentX = line.isFirst ? x + indent : x;
            page.drawText(line.text, { x: currentX, y: currentY, font, size, color });
            currentY -= lineHeight;
        }
    }

    function drawCheckmark(page, x, y, color) {
        page.drawLine({ start: { x: x, y: y + 4 }, end: { x: x + 4, y: y }, thickness: 1.5, color: color });
        page.drawLine({ start: { x: x + 4, y: y }, end: { x: x + 10, y: y + 8 }, thickness: 1.5, color: color });
    }

    // =====================================================================
    // 🚀 ОТПРАВКА ФОРМЫ И ГЕНЕРАЦИЯ PDF
    // =====================================================================
    document.getElementById('vvkForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.textContent = 'Генерация PDF...';

        try {
            const url = './template.pdf'; 
            const existingPdfBytes = await fetch(url).then(res => res.arrayBuffer());
            const pdfDoc = await PDFLib.PDFDocument.load(existingPdfBytes);
            pdfDoc.registerFontkit(fontkit);
            const fontBytes = await fetch('https://cdnjs.cloudflare.com/ajax/libs/ink/3.1.10/fonts/Roboto/roboto-regular-webfont.ttf').then(res => res.arrayBuffer());
            const customFont = await pdfDoc.embedFont(fontBytes);
            const firstPage = pdfDoc.getPages()[0];

            const getVal = (id) => document.getElementById(id).value;
            const fontSize = 10;
            const black = PDFLib.rgb(0, 0, 0);
            const textOptions = { size: fontSize, font: customFont, color: black };
            const paraOptions = { ...textOptions, lineHeight: 12 };

            // --- ЦЕНТРИРУЕМЫЕ ПОЛЯ ---
            drawCenteredInRange(firstPage, getVal('dateDay'), COORDS.date.day.xStart, COORDS.date.day.xEnd, COORDS.date.day.y, textOptions);
            drawCenteredInRange(firstPage, getVal('dateMonth'), COORDS.date.month.xStart, COORDS.date.month.xEnd, COORDS.date.month.y, textOptions);
            drawCenteredInRange(firstPage, getVal('dateYear'), COORDS.date.year.xStart, COORDS.date.year.xEnd, COORDS.date.year.y, textOptions);
            
            drawCenteredInRange(firstPage, `№ ${getVal('docNumber')}`, COORDS.docNumber.xStart, COORDS.docNumber.xEnd, COORDS.docNumber.y, textOptions);
            
            drawCenteredInRange(firstPage, getVal('dobDay'), COORDS.dob.day.xStart, COORDS.dob.day.xEnd, COORDS.dob.day.y, textOptions);
            drawCenteredInRange(firstPage, getVal('dobMonth'), COORDS.dob.month.xStart, COORDS.dob.month.xEnd, COORDS.dob.month.y, textOptions);
            drawCenteredInRange(firstPage, getVal('dobYear'), COORDS.dob.year.xStart, COORDS.dob.year.xEnd, COORDS.dob.year.y, textOptions);

            drawCenteredInRange(firstPage, getVal('passSeries'), COORDS.passSeries.xStart, COORDS.passSeries.xEnd, COORDS.passSeries.y, textOptions);
            drawCenteredInRange(firstPage, getVal('passNumber'), COORDS.passNumber.xStart, COORDS.passNumber.xEnd, COORDS.passNumber.y, textOptions);
            drawCenteredInRange(firstPage, getVal('summons'), COORDS.summons.xStart, COORDS.summons.xEnd, COORDS.summons.y, textOptions);

            // --- ОБЫЧНЫЕ ПОЛЯ (ЛЕВОЕ ВЫРАВНИВАНИЕ) ---
            firstPage.drawText(getVal('chairman'), { x: COORDS.chairman.x, y: COORDS.chairman.y, ...textOptions });
            firstPage.drawText(getVal('firstName'), { x: COORDS.firstName.x, y: COORDS.firstName.y, ...textOptions });
            firstPage.drawText(getVal('patronymic'), { x: COORDS.patronymic.x, y: COORDS.patronymic.y, ...textOptions });
            firstPage.drawText(getVal('pob'), { x: COORDS.pob.x, y: COORDS.pob.y, ...textOptions });
            firstPage.drawText(getVal('address'), { x: COORDS.address.x, y: COORDS.address.y, ...textOptions });

            // --- МНОГОСТРОЧНЫЕ ПОЛЯ ---
            drawParagraph(firstPage, getVal('complaints'), COORDS.complaints.x, COORDS.complaints.y, { ...paraOptions, maxWidth: COORDS.complaints.maxWidth, indent: COORDS.complaints.indent });
            drawParagraph(firstPage, getVal('anamnesis'), COORDS.anamnesis.x, COORDS.anamnesis.y, { ...paraOptions, maxWidth: COORDS.anamnesis.maxWidth, indent: COORDS.anamnesis.indent });
            drawParagraph(firstPage, getVal('objectiveData'), COORDS.objectiveData.x, COORDS.objectiveData.y, { ...paraOptions, maxWidth: COORDS.objectiveData.maxWidth, indent: COORDS.objectiveData.indent });
            drawParagraph(firstPage, getVal('diagnosis'), COORDS.diagnosis.x, COORDS.diagnosis.y, { ...paraOptions, maxWidth: COORDS.diagnosis.maxWidth, indent: COORDS.diagnosis.indent });
            drawParagraph(firstPage, getVal('recommendations'), COORDS.recommendations.x, COORDS.recommendations.y, { ...paraOptions, maxWidth: COORDS.recommendations.maxWidth, indent: COORDS.recommendations.indent });

            // --- ГАЛОЧКА ---
            const category = document.querySelector('input[name="category"]:checked').value;
            if (category) {
                const pos = COORDS.categories[category];
                drawCheckmark(firstPage, pos.x, pos.y, black);
            }

            const pdfBytes = await pdfDoc.save();
            const blob = new Blob([pdfBytes], { type: 'application/pdf' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `Заключение_ВВК_${getVal('firstName')}.pdf`;
            link.click();

        } catch (error) {
            console.error(error);
            alert("Ошибка: " + error.message);
        } finally {
            btn.disabled = false;
            btn.textContent = 'Скачать заполненный PDF';
        }
    });
</script>
</body>
</html>
