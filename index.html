<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЕСС | Служебный портал</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #1e3a8a; --bg: #f3f4f6; --text: #333; --danger: #ef4444; --success: #10b981; }
        body { margin: 0; font-family: sans-serif; background: var(--bg); color: var(--text); }
        
        /* Вход */
        #auth-screen { display: flex; justify-content: center; align-items: center; height: 100vh; padding: 15px; box-sizing: border-box; }
        .auth-box { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        .auth-box input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        .btn-login { width: 100%; padding: 12px; border: none; border-radius: 4px; font-weight: bold; background: var(--primary); color: white; cursor: pointer; font-size: 16px; }
        .error-msg { color: var(--danger); display: none; margin-bottom: 15px; font-size: 14px; }

        /* Кабинет */
        #dashboard-screen { display: none; min-height: 100vh; }
        .sidebar { width: 260px; background: var(--primary); color: white; position: fixed; height: 100%; overflow-y: auto; z-index: 100; transition: 0.3s; }
        .sidebar h2 { padding: 20px; margin: 0; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 18px; }
        
        .menu-label { padding: 15px 20px 5px 20px; font-size: 11px; color: #93c5fd; text-transform: uppercase; letter-spacing: 1px; font-weight: bold; }
        .menu-item { padding: 12px 20px; cursor: pointer; border-left: 4px solid transparent; transition: 0.2s; font-size: 14px; }
        .menu-item:hover, .menu-item.active { background: rgba(255,255,255,0.1); border-left-color: #60a5fa; }
        
        .main-content { margin-left: 260px; padding: 30px; }
        .header { display: flex; justify-content: space-between; margin-bottom: 20px; align-items: center; flex-wrap: wrap; gap: 15px; }
        
        /* Таблицы (с адаптацией под мобилки) */
        .table-responsive { width: 100%; overflow-x: auto; background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f8fafc; color: #64748b; font-weight: bold; font-size: 14px; white-space: nowrap; }
        
        .btn-action { border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; color: white; font-weight: bold; font-size: 13px; text-decoration: none; display: inline-block; margin-bottom: 4px; margin-right: 4px; }
        .btn-edit { background: #eab308; }
        .btn-delete { background: var(--danger); }
        .btn-download { background: #64748b; }
        .btn-view { background: var(--primary); }
        .btn-add { background: var(--success); padding: 10px 20px; font-size: 14px; }

        /* Модалки */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; padding: 15px; box-sizing: border-box; }
        .modal-content { background: white; padding: 25px; border-radius: 8px; width: 100%; max-width: 450px; max-height: 90vh; overflow-y: auto; }
        .modal-content label { display: block; margin-top: 10px; font-weight: bold; font-size: 13px; }
        .modal-content input, .modal-content select { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
        .modal-actions { margin-top: 20px; display: flex; gap: 10px; }
        .modal-actions button { flex: 1; padding: 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 15px; }
        .btn-save { background: var(--success); color: white; }
        .btn-cancel { background: #ccc; color: #333; }

        #preview-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 2000; justify-content: center; align-items: center; flex-direction: column; }
        .preview-container { width: 95%; height: 95%; background: white; border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; }
        .preview-header { padding: 15px 20px; background: #f8fafc; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; flex-wrap: wrap; gap: 10px; }
        .preview-header h3 { margin: 0; color: #333; }
        .preview-iframe { flex: 1; width: 100%; border: none; }

        /* 📱 МОБИЛЬНАЯ АДАПТАЦИЯ */
        @media (max-width: 768px) {
            .sidebar { width: 100%; height: auto; position: relative; display: flex; flex-direction: column; }
            .sidebar h2 { display: none; } /* Скрываем логотип, чтобы сэкономить место */
            .menu-label { display: none; }
            
            /* Делаем меню горизонтальным */
            .sidebar-menu-container { display: flex; overflow-x: auto; white-space: nowrap; padding-bottom: 5px; }
            .menu-item { border-left: none; border-bottom: 3px solid transparent; padding: 12px 15px; flex-shrink: 0; }
            .menu-item.active { border-left: none; border-bottom: 3px solid #60a5fa; background: transparent; }
            
            .main-content { margin-left: 0; padding: 15px; }
            .header { flex-direction: column; align-items: flex-start; }
            .header > div { width: 100%; }
            .btn-login { width: 100% !important; }
        }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-box">
            <h2>Служебный портал</h2>
            <div id="auth-error" class="error-msg"></div>
            <form id="login-form">
                <input type="email" id="email" placeholder="Служебный Email" required>
                <input type="password" id="password" placeholder="Пароль" required>
                <button type="submit" class="btn-login">Войти</button>
            </form>
            <a href="citizen.html" style="display:block; margin-top:15px; color:#666; font-size:14px; text-decoration:none;">Я гражданин</a>
        </div>
    </div>

    <div id="dashboard-screen">
        <div class="sidebar">
            <h2>Служебный портал</h2>
            
            <div class="sidebar-menu-container">
                <!-- БЛОК ОРГАНИЗАЦИЙ -->
                <div class="menu-item active org-tab" data-org="1" onclick="switchOrg(1, this)">🚑 ЕСС</div>
                <div class="menu-item org-tab" data-org="2" onclick="switchOrg(2, this)">🚓 МВД</div>
                <div class="menu-item org-tab" data-org="3" onclick="switchOrg(3, this)">🏛️ Правительство</div>
                <div class="menu-item org-tab" data-org="4" onclick="switchOrg(4, this)">🪖 ВЧ</div>

                <div class="menu-item active doc-menu-item" onclick="switchTab('docs', this)" style="margin-left: 20px;">📄 Документы</div>
                <div class="menu-item patient-menu-item" onclick="switchTab('citizens', this)">👥 Граждане</div>
                
                <div class="menu-item" onclick="goToGenerator()" style="color: #6ee7b7; font-weight: bold;">➕ Создать</div>
            </div>
        </div>

        <div class="main-content">
            <div class="header">
                <h2 id="page-title">Документы: ЕСС</h2>
                <button class="btn-login" id="logout-btn" style="padding:8px 15px; width:auto; cursor:pointer; background:#ef4444;">Выйти</button>
            </div>

            <div id="docs-tab">
                <div class="table-responsive">
                    <table>
                        <thead><tr><th>Номер</th><th>Тип</th><th>Получатель</th><th>Дата</th><th>Действия</th></tr></thead>
                        <tbody id="docs-table-body"></tbody>
                    </table>
                </div>
            </div>

            <div id="citizens-tab" style="display:none;">
                <div style="margin-bottom: 15px; text-align: right;">
                    <button class="btn-action btn-add" onclick="openAddCitizenModal()">+ Добавить гражданина</button>
                </div>
                <div class="table-responsive">
                    <table>
                        <thead><tr><th>ФИО</th><th>Дата рождения</th><th>Паспорт</th><th>Действия</th></tr></thead>
                        <tbody id="citizens-table-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Модалка редактирования -->
    <div id="edit-modal" class="modal">
        <div class="modal-content">
            <h3>Редактировать гражданина</h3>
            <input type="hidden" id="edit-id">
            <label>Фамилия</label><input type="text" id="edit-last-name">
            <label>Имя</label><input type="text" id="edit-first-name">
            <label>Отчество</label><input type="text" id="edit-patronymic">
            <label>Дата рождения</label><input type="date" id="edit-dob">
            <label>Место рождения</label><input type="text" id="edit-pob">
            <label>Адрес</label><input type="text" id="edit-address">
            <label>Серия паспорта</label><input type="text" id="edit-pass-series">
            <label>Номер паспорта</label><input type="text" id="edit-pass-number">
            <div class="modal-actions">
                <button class="btn-save" onclick="saveCitizen()">Сохранить</button>
                <button class="btn-cancel" onclick="closeModal('edit-modal')">Отмена</button>
            </div>
        </div>
    </div>

    <!-- Модалка добавления -->
    <div id="add-modal" class="modal">
        <div class="modal-content">
            <h3>Новый гражданин</h3>
            <label>Организация</label>
            <select id="add-org-id">
                <option value="1">ЕСС</option>
                <option value="2">МВД</option>
                <option value="3">Правительство</option>
                <option value="4">ВЧ</option>
            </select>
            <label>Email (логин)</label><input type="email" id="add-email">
            <label>Пароль</label><input type="text" id="add-password" value="123456">
            <label>Фамилия</label><input type="text" id="add-last-name">
            <label>Имя</label><input type="text" id="add-first-name">
            <label>Отчество</label><input type="text" id="add-patronymic">
            <label>Дата рождения</label><input type="date" id="add-dob">
            <label>Место рождения</label><input type="text" id="add-pob">
            <div class="modal-actions">
                <button class="btn-save" onclick="addCitizen()">Создать</button>
                <button class="btn-cancel" onclick="closeModal('add-modal')">Отмена</button>
            </div>
        </div>
    </div>

    <div id="preview-modal">
        <div class="preview-container">
            <div class="preview-header">
                <h3>Просмотр документа</h3>
                <div>
                    <a id="preview-download-btn" href="#" class="btn-action btn-download" download style="padding: 10px 20px;">Скачать</a>
                    <button class="btn-action btn-delete" onclick="closePreview()" style="padding: 10px 20px;">Закрыть</button>
                </div>
            </div>
            <iframe id="preview-frame" class="preview-iframe"></iframe>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://omnrekfdjurrfzrwfzzn.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_v0z_8kT0ZmFH1uPiamR60w_vDNsIfKg';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let currentOrgId = 1; 
        let currentOrgName = 'ЕСС';
        let currentTab = 'docs';

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const { error } = await supabaseClient.auth.signInWithPassword({
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            });
            if (error) {
                document.getElementById('auth-error').textContent = error.message;
                document.getElementById('auth-error').style.display = 'block';
            }
        });

        document.getElementById('logout-btn').addEventListener('click', () => supabaseClient.auth.signOut());

        supabaseClient.auth.onAuthStateChange(async (event, session) => {
            if (session) {
                const { data: profile } = await supabaseClient.from('profiles').select('role').eq('id', session.user.id).single();
                if (!profile || profile.role !== 'admin') {
                    alert("У вас нет прав администратора!");
                    await supabaseClient.auth.signOut();
                    return;
                }
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('dashboard-screen').style.display = 'block';
                refreshData();
            } else {
                document.getElementById('auth-screen').style.display = 'flex';
                document.getElementById('dashboard-screen').style.display = 'none';
            }
        });

        function switchOrg(orgId, element) {
            document.querySelectorAll('.org-tab').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            currentOrgId = orgId;
            currentOrgName = element.textContent.replace(/[^\w\sА-Яа-я]/g, '').trim();
            updatePageTitle();
            refreshData();
        }

        function switchTab(tab, element) {
            currentTab = tab;
            document.querySelectorAll('.doc-menu-item, .patient-menu-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            
            if (tab === 'docs') {
                document.getElementById('docs-tab').style.display = 'block';
                document.getElementById('citizens-tab').style.display = 'none';
            } else {
                document.getElementById('docs-tab').style.display = 'none';
                document.getElementById('citizens-tab').style.display = 'block';
            }
            updatePageTitle();
        }

        function updatePageTitle() {
            const suffix = currentTab === 'docs' ? 'Документы' : 'Граждане';
            document.getElementById('page-title').textContent = `${suffix}: ${currentOrgName}`;
        }

        function goToGenerator() {
            window.location.href = `generator-vvk.html?org=${currentOrgId}`;
        }

        function refreshData() {
            loadDocs();
            loadCitizens();
        }

        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function closePreview() { document.getElementById('preview-modal').style.display = 'none'; document.getElementById('preview-frame').src = ''; }
        function previewDoc(url) {
            document.getElementById('preview-frame').src = url;
            document.getElementById('preview-download-btn').href = url;
            document.getElementById('preview-modal').style.display = 'flex';
        }

        async function loadDocs() {
            const tbody = document.getElementById('docs-table-body');
            tbody.innerHTML = '<tr><td colspan="5">Загрузка...</td></tr>';
            
            const { data, error } = await supabaseClient
                .from('documents')
                .select(`*, profiles(last_name, first_name, patronymic)`)
                .eq('organization_id', currentOrgId)
                .order('created_at', {ascending: false});
            
            if (error) return console.error(error);
            tbody.innerHTML = '';
            if(data.length === 0) tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">Нет документов</td></tr>';

            data.forEach(doc => {
                const { data: { publicUrl } } = supabaseClient.storage.from('documents').getPublicUrl(doc.file_path);
                const recipient = doc.profiles 
                    ? `${doc.profiles.last_name} ${doc.profiles.first_name} ${doc.profiles.patronymic || ''}` 
                    : '<span style="color:#888; font-style:italic;">Внутренний (Без гражданина)</span>';

                tbody.innerHTML += `
                    <tr>
                        <td><b>${doc.doc_number}</b></td>
                        <td>${doc.document_type}</td>
                        <td>${recipient}</td>
                        <td>${new Date(doc.created_at).toLocaleDateString()}</td>
                        <td>
                            <button class="btn-action btn-view" onclick="previewDoc('${publicUrl}')">Просмотр</button>
                            <button class="btn-action btn-delete" onclick="deleteDoc(${doc.id}, '${doc.file_path}')">Удалить</button>
                        </td>
                    </tr>
                `;
            });
        }

        async function deleteDoc(docId, filePath) {
            if (!confirm("Удалить документ навсегда?")) return;
            await supabaseClient.storage.from('documents').remove([filePath]);
            const { error } = await supabaseClient.from('documents').delete().eq('id', docId);
            if (error) alert("Ошибка: " + error.message);
            else loadDocs();
        }

        async function loadCitizens() {
            const tbody = document.getElementById('citizens-table-body');
            tbody.innerHTML = '<tr><td colspan="4">Загрузка...</td></tr>';
            
            const { data, error } = await supabaseClient
                .from('profiles')
                .select('*')
                .eq('role', 'patient')
                .eq('organization_id', currentOrgId)
                .order('last_name');
            
            if (error) return console.error(error);
            tbody.innerHTML = '';
            if(data.length === 0) tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">Нет граждан в этой организации</td></tr>';

            data.forEach(p => {
                tbody.innerHTML += `
                    <tr>
                        <td>${p.last_name} ${p.first_name} ${p.patronymic || ''}</td>
                        <td>${p.dob ? new Date(p.dob).toLocaleDateString() : '—'}</td>
                        <td>${p.pass_series || ''} ${p.pass_number || ''}</td>
                        <td><button class="btn-action btn-edit" onclick="openEdit('${p.id}')">Ред.</button></td>
                    </tr>
                `;
            });
        }

        async function openEdit(id) {
            const { data: p } = await supabaseClient.from('profiles').select('*').eq('id', id).single();
            if (!p) return;
            document.getElementById('edit-id').value = p.id;
            document.getElementById('edit-last-name').value = p.last_name || '';
            document.getElementById('edit-first-name').value = p.first_name || '';
            document.getElementById('edit-patronymic').value = p.patronymic || '';
            document.getElementById('edit-dob').value = p.dob || '';
            document.getElementById('edit-pob').value = p.pob || '';
            document.getElementById('edit-address').value = p.address || '';
            document.getElementById('edit-pass-series').value = p.pass_series || '';
            document.getElementById('edit-pass-number').value = p.pass_number || '';
            document.getElementById('edit-modal').style.display = 'flex';
        }

        async function saveCitizen() {
            const id = document.getElementById('edit-id').value;
            const updates = {
                last_name: document.getElementById('edit-last-name').value,
                first_name: document.getElementById('edit-first-name').value,
                patronymic: document.getElementById('edit-patronymic').value,
                dob: document.getElementById('edit-dob').value || null,
                pob: document.getElementById('edit-pob').value,
                address: document.getElementById('edit-address').value,
                pass_series: document.getElementById('edit-pass-series').value,
                pass_number: document.getElementById('edit-pass-number').value
            };
            const { error } = await supabaseClient.from('profiles').update(updates).eq('id', id);
            if (error) alert("Ошибка: " + error.message);
            else { closeModal('edit-modal'); loadCitizens(); }
        }

        function openAddCitizenModal() {
            document.getElementById('add-email').value = '';
            document.getElementById('add-last-name').value = '';
            document.getElementById('add-first-name').value = '';
            document.getElementById('add-patronymic').value = '';
            document.getElementById('add-dob').value = '';
            document.getElementById('add-pob').value = '';
            document.getElementById('add-org-id').value = currentOrgId; 
            document.getElementById('add-modal').style.display = 'flex';
        }

        async function addCitizen() {
            const email = document.getElementById('add-email').value;
            const password = document.getElementById('add-password').value;
            const orgId = document.getElementById('add-org-id').value;

            const tempClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
                auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }
            });
            
            const { data: authData, error: authError } = await tempClient.auth.signUp({ email, password });
            if (authError) return alert("Ошибка создания: " + authError.message);

            const updates = {
                last_name: document.getElementById('add-last-name').value,
                first_name: document.getElementById('add-first-name').value,
                patronymic: document.getElementById('add-patronymic').value,
                dob: document.getElementById('add-dob').value || null,
                pob: document.getElementById('add-pob').value,
                role: 'patient',
                organization_id: orgId
            };

            const { error: profileError } = await supabaseClient.from('profiles').update(updates).eq('id', authData.user.id);
            if (profileError) alert("Ошибка сохранения: " + profileError.message);
            else { alert("Гражданин добавлен!"); closeModal('add-modal'); refreshData(); }
        }
    </script>
</body>
</html>
