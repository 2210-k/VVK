<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заполнение заключения ВВК</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input[type="text"], input[type="date"], textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        textarea { resize: vertical; height: 60px; }
        .radio-group { display: flex; gap: 15px; margin-top: 5px; }
        .radio-group label { font-weight: normal; display: flex; align-items: center; gap: 5px; cursor: pointer; }
        button { background: #0056b3; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 20px; }
        button:hover { background: #004494; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .row { display: flex; gap: 15px; }
        .row > .form-group { flex: 1; }
    </style>
</head>
<body>

<div class="container">
    <h2>Заполнение заключения ВВК</h2>
    <form id="vvkForm">
        <div class="row">
            <div class="form-group">
                <label>Дата (ДД.ММ.ГГГГ)</label>
                <input type="date" id="date" required>
            </div>
            <div class="form-group">
                <label>№ документа (сгенерируется)</label>
                <input type="text" id="docNumber" readonly>
            </div>
        </div>

        <div class="form-group">
            <label>Председатель комиссии (должность, звание, инициалы)</label>
            <input type="text" id="chairman" placeholder="Например: Врач-терапевт, майор м/с Иванов И.И." required>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Имя</label>
                <input type="text" id="firstName" required>
            </div>
            <div class="form-group">
                <label>Отчество</label>
                <input type="text" id="patronymic" required>
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Дата рождения</label>
                <input type="date" id="dob" required>
            </div>
            <div class="form-group">
                <label>Место рождения</label>
                <input type="text" id="pob" required>
            </div>
        </div>

        <div class="form-group">
            <label>Адрес регистрации</label>
            <input type="text" id="address" required>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Паспорт (Серия)</label>
                <input type="text" id="passSeries" maxlength="4" required>
            </div>
            <div class="form-group">
                <label>Паспорт (Номер)</label>
                <input type="text" id="passNumber" maxlength="6" required>
            </div>
            <div class="form-group">
                <label>№ повестки</label>
                <input type="text" id="summons" required>
            </div>
        </div>

        <div class="form-group">
            <label>Жалобы</label>
            <textarea id="complaints"></textarea>
        </div>

        <div class="form-group">
            <label>Анамнез</label>
            <textarea id="anamnesis"></textarea>
        </div>

        <div class="form-group">
            <label>Данные объективного обследования</label>
            <textarea id="objectiveData"></textarea>
        </div>

        <div class="form-group">
            <label>Диагноз</label>
            <textarea id="diagnosis"></textarea>
        </div>

        <div class="form-group">
            <label>Категория годности</label>
            <div class="radio-group">
                <label><input type="radio" name="category" value="A" required> А</label>
                <label><input type="radio" name="category" value="B"> Б</label>
                <label><input type="radio" name="category" value="V"> В</label>
                <label><input type="radio" name="category" value="G"> Г</label>
                <label><input type="radio" name="category" value="D"> Д</label>
            </div>
        </div>

        <div class="form-group">
            <label>Рекомендации комиссии</label>
            <textarea id="recommendations"></textarea>
        </div>

        <button type="submit" id="submitBtn">Скачать заполненный PDF</button>
    </form>
</div>

<!-- Подключение библиотек -->
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://unpkg.com/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>

<script>
    // Генерация номера документа при загрузке
    document.getElementById('docNumber').value = Math.floor(1000 + Math.random() * 9000);

    document.getElementById('vvkForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.textContent = 'Генерация PDF...';

        try {
            // 1. Загружаем шаблон PDF
            // ВАЖНО: Файл template.pdf должен лежать в той же папке, что и index.html!
            const url = './template.pdf'; 
            const existingPdfBytes = await fetch(url).then(res => {
                if (!res.ok) throw new Error(`Не удалось загрузить ${url}. Убедитесь, что файл существует.`);
                return res.arrayBuffer();
            });

            // 2. Загружаем документ и шрифт
            // ИСПОЛЬЗУЕМ PDFLib, а не PDFDocument!
            const pdfDoc = await PDFLib.PDFDocument.load(existingPdfBytes);
            pdfDoc.registerFontkit(fontkit);

            // Загружаем шрифт с поддержкой кириллицы (Roboto)
            const fontBytes = await fetch('https://cdnjs.cloudflare.com/ajax/libs/ink/3.1.10/fonts/Roboto/roboto-regular-webfont.ttf').then(res => res.arrayBuffer());
            const customFont = await pdfDoc.embedFont(fontBytes);

            const pages = pdfDoc.getPages();
            const firstPage = pages[0];

            // Функция для форматирования даты из YYYY-MM-DD в DD.MM.YYYY
            const formatDate = (dateString) => {
                if (!dateString) return '';
                const [year, month, day] = dateString.split('-');
                return `${day}.${month}.${year}`;
            };

            // Собираем данные из формы
            const formData = {
                date: formatDate(document.getElementById('date').value),
                docNumber: document.getElementById('docNumber').value,
                chairman: document.getElementById('chairman').value,
                firstName: document.getElementById('firstName').value,
                patronymic: document.getElementById('patronymic').value,
                dob: formatDate(document.getElementById('dob').value),
                pob: document.getElementById('pob').value,
                address: document.getElementById('address').value,
                passSeries: document.getElementById('passSeries').value,
                passNumber: document.getElementById('passNumber').value,
                summons: document.getElementById('summons').value,
                complaints: document.getElementById('complaints').value,
                anamnesis: document.getElementById('anamnesis').value,
                objectiveData: document.getElementById('objectiveData').value,
                diagnosis: document.getElementById('diagnosis').value,
                recommendations: document.getElementById('recommendations').value,
                category: document.querySelector('input[name="category"]:checked').value
            };

            const fontSize = 10;
            // ИСПОЛЬЗУЕМ PDFLib.rgb
            const color = PDFLib.rgb(0, 0, 0); // Черный цвет

            // --- НАНОСИМ ТЕКСТ ---
            // ВНИМАНИЕ: Координаты (x, y) приблизительные! 
            // Отсчет идет от ЛЕВОГО НИЖНЕГО угла.

            // Дата и номер (вверху справа)
            firstPage.drawText(formData.date, { x: 420, y: 745, size: fontSize, font: customFont, color });
            firstPage.drawText(`№ ${formData.docNumber}`, { x: 520, y: 745, size: fontSize, font: customFont, color });

            // Председатель
            firstPage.drawText(formData.chairman, { x: 180, y: 690, size: fontSize, font: customFont, color });

            // Имя и Отчество
            firstPage.drawText(formData.firstName, { x: 80, y: 610, size: fontSize, font: customFont, color });
            firstPage.drawText(formData.patronymic, { x: 320, y: 610, size: fontSize, font: customFont, color });

            // Дата рождения и Место рождения
            firstPage.drawText(formData.dob, { x: 150, y: 590, size: fontSize, font: customFont, color });
            firstPage.drawText(formData.pob, { x: 450, y: 590, size: fontSize, font: customFont, color });

            // Адрес
            firstPage.drawText(formData.address, { x: 150, y: 570, size: fontSize, font: customFont, color });

            // Паспорт и Повестка
            firstPage.drawText(formData.passSeries, { x: 140, y: 550, size: fontSize, font: customFont, color });
            firstPage.drawText(formData.passNumber, { x: 230, y: 550, size: fontSize, font: customFont, color });
            firstPage.drawText(formData.summons, { x: 420, y: 550, size: fontSize, font: customFont, color });

            // Длинные текстовые поля (используем maxWidth для переноса строк)
            const textOptions = { size: fontSize, font: customFont, color, maxWidth: 450, lineHeight: 12 };
            
            firstPage.drawText(formData.complaints, { x: 100, y: 520, ...textOptions });
            firstPage.drawText(formData.anamnesis, { x: 100, y: 480, ...textOptions });
            firstPage.drawText(formData.objectiveData, { x: 100, y: 440, ...textOptions });
            firstPage.drawText(formData.diagnosis, { x: 100, y: 400, ...textOptions });

            // Рекомендации
            firstPage.drawText(formData.recommendations, { x: 100, y: 200, ...textOptions });

            // --- ГАЛОЧКА КАТЕГОРИИ ГОДНОСТИ ---
            const categoryYPositions = {
                'A': 330,
                'B': 310,
                'V': 290,
                'G': 270,
                'D': 250
            };

            if (formData.category) {
                const yPos = categoryYPositions[formData.category];
                // Рисуем крестик (две линии)
                firstPage.drawText('X', { 
                    x: 82, 
                    y: yPos - 3, 
                    size: 12, 
                    font: customFont, 
                    color: PDFLib.rgb(1, 0, 0) // Красный цвет
                });
            }

            // 3. Сохраняем и скачиваем
            const pdfBytes = await pdfDoc.save();
            const blob = new Blob([pdfBytes], { type: 'application/pdf' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `Заключение_ВВК_${formData.firstName}_${formData.patronymic}.pdf`;
            link.click();

        } catch (error) {
            console.error("Ошибка генерации PDF:", error);
            alert("Ошибка: " + error.message + "\nПроверьте консоль (F12) для подробностей.");
        } finally {
            btn.disabled = false;
            btn.textContent = 'Скачать заполненный PDF';
        }
    });
</script>
</body>
</html>
