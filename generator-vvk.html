<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор ВВК</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; padding: 15px; margin: 0; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        input[type="text"], textarea, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        textarea { resize: vertical; height: 60px; }
        .form-select { background-color: #eef5ff; font-weight: bold; margin-bottom: 5px; cursor: pointer; }
        button[type="submit"] { background: #0056b3; color: white; border: none; padding: 15px; font-size: 16px; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 20px; font-weight: bold; }
        button[type="submit"]:hover { background: #004494; }
        button[type="submit"]:disabled { background: #ccc; cursor: not-allowed; }
        .row { display: flex; gap: 15px; }
        .row > .form-group { flex: 1; }
        .date-group { display: flex; gap: 5px; }
        .date-group input, .date-group select, .center-input { text-align: center; }
        .date-group .day { width: 30%; }
        .date-group .month { width: 70%; }
        .date-group .year { width: 40%; }
        .back-btn { display: inline-block; margin-bottom: 20px; color: #0056b3; text-decoration: none; font-weight: bold; }
        .patient-selector { background: #eef5ff; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #b3ccee; }
        .radio-group { display: flex; gap: 15px; margin-top: 5px; flex-wrap: wrap; }
        .radio-group label { font-weight: normal; display: flex; align-items: center; gap: 5px; cursor: pointer; }

        #preview-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; flex-direction: column; }
        .preview-container { width: 95%; height: 95%; background: white; border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .preview-header { padding: 15px 20px; background: #f8fafc; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; flex-wrap: wrap; gap: 10px; }
        .preview-header h3 { margin: 0; color: #333; }
        .btn-preview { border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px; }
        .btn-dl { background: #10b981; color: white; }
        .btn-close { background: #ef4444; color: white; }
        .preview-iframe { flex: 1; width: 100%; border: none; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="back-btn">← Вернуться на портал</a>
    
    <div class="patient-selector">
        <label>👤 Выберите гражданина (данные подставятся)</label>
        <select id="patientSelect" class="form-select">
            <option value="none">-- Без гражданина (В архив) --</option>
        </select>
    </div>

    <!-- ЭТА НАДПИСЬ ДОКАЖЕТ, ЧТО ОТКРЫЛСЯ НУЖНЫЙ ФАЙЛ -->
    <h2 style="color: #1e3a8a; border-bottom: 2px solid #1e3a8a; padding-bottom: 10px;">Заключение ВВК</h2>
    
    <form id="vvkForm">
        <div class="row">
            <div class="form-group">
                <label>Дата заключения</label>
                <div class="date-group">
                    <input type="text" id="dateDay" class="day" maxlength="2" required>
                    <select id="dateMonth" class="month" required></select>
                    <input type="text" id="dateYear" class="year" maxlength="4" required>
                </div>
            </div>
            <div class="form-group">
                <label>№ документа</label>
                <input type="text" id="docNumber" class="center-input" required>
            </div>
        </div>

        <div class="form-group">
            <label>Председатель комиссии</label>
            <input type="text" id="chairman" required>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Имя</label>
                <input type="text" id="firstName">
            </div>
            <div class="form-group">
                <label>Отчество</label>
                <input type="text" id="patronymic">
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Дата рождения</label>
                <div class="date-group">
                    <input type="text" id="dobDay" class="day" placeholder="ДД" maxlength="2">
                    <select id="dobMonth" class="month"></select>
                    <input type="text" id="dobYear" class="year" placeholder="ГГ" maxlength="2">
                </div>
            </div>
            <div class="form-group">
                <label>Место рождения</label>
                <input type="text" id="pob">
            </div>
        </div>

        <div class="form-group">
            <label>Адрес регистрации</label>
            <input type="text" id="address">
        </div>

        <div class="row">
            <div class="form-group">
                <label>Паспорт (Серия)</label>
                <input type="text" id="passSeries" class="center-input" maxlength="4">
            </div>
            <div class="form-group">
                <label>Паспорт (Номер)</label>
                <input type="text" id="passNumber" class="center-input" maxlength="6">
            </div>
            <div class="form-group">
                <label>№ повестки</label>
                <input type="text" id="summons" class="center-input" required>
            </div>
        </div>

        <div class="form-group">
            <label>Жалобы</label>
            <select id="template-complaints" class="form-select"><option value="">-- Выбрать шаблон --</option></select>
            <textarea id="complaints"></textarea>
        </div>

        <div class="form-group">
            <label>Анамнез</label>
            <select id="template-anamnesis" class="form-select"><option value="">-- Выбрать шаблон --</option></select>
            <textarea id="anamnesis"></textarea>
        </div>

        <div class="form-group">
            <label>Данные объективного обследования</label>
            <select id="template-objectiveData" class="form-select"><option value="">-- Выбрать шаблон --</option></select>
            <textarea id="objectiveData"></textarea>
        </div>

        <div class="form-group">
            <label>Диагноз</label>
            <select id="template-diagnosis" class="form-select"><option value="">-- Выбрать шаблон --</option></select>
            <textarea id="diagnosis"></textarea>
        </div>

        <div class="form-group">
            <label>Категория годности</label>
            <div class="radio-group">
                <label><input type="radio" name="category" value="A" required> А</label>
                <label><input type="radio" name="category" value="B"> Б</label>
                <label><input type="radio" name="category" value="V"> В</label>
                <label><input type="radio" name="category" value="G"> Г</label>
                <label><input type="radio" name="category" value="D"> Д</label>
            </div>
        </div>

        <div class="form-group">
            <label>Рекомендации комиссии</label>
            <select id="template-recommendations" class="form-select"><option value="">-- Выбрать шаблон --</option></select>
            <textarea id="recommendations"></textarea>
        </div>

        <button type="submit" id="submitBtn">Сгенерировать и сохранить PDF</button>
    </form>
</div>

<div id="preview-modal">
    <div class="preview-container">
        <div class="preview-header">
            <h3>Предпросмотр ВВК</h3>
            <div>
                <button class="btn-preview btn-dl" id="download-btn">Скачать PDF</button>
                <button class="btn-preview btn-close" id="close-preview-btn">Закрыть</button>
            </div>
        </div>
        <iframe id="pdf-preview-frame" class="preview-iframe"></iframe>
    </div>
</div>

<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://unpkg.com/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>

<script>
    const supabaseClient = supabase.createClient('https://omnrekfdjurrfzrwfzzn.supabase.co', 'sb_publishable_v0z_8kT0ZmFH1uPiamR60w_vDNsIfKg');
    const urlParams = new URLSearchParams(window.location.search);
    const currentOrgId = parseInt(urlParams.get('org')) || 1;

    const COORDS = {
        date: { day: { xStart: 50, xEnd: 65, y: 665 }, month: { xStart: 77, xEnd: 163, y: 665 }, year: { xStart: 177, xEnd: 213, y: 665 } },
        docNumber: { xStart: 510, xEnd: 546, y: 665 },
        chairman: { x: 172, y: 632.5 },
        firstName: { x: 74, y: 561 },
        patronymic: { x: 354, y: 561 },
        dob: { day: { xStart: 138, xEnd: 153, y: 547 }, month: { xStart: 161, xEnd: 235, y: 547 }, year: { xStart: 251, xEnd: 263, y: 547 } },
        pob: { x: 387, y: 548 },
        address: { x: 147, y: 533 },
        passSeries: { xStart: 128, xEnd: 155, y: 520 },
        passNumber: { xStart: 178, xEnd: 227, y: 520 },
        summons: { xStart: 363, xEnd: 404, y: 520 },
        complaints: { x: 50, y: 506, maxWidth: 492, indent: 43, lineHeight: 14 }, 
        anamnesis: { x: 50, y: 494, maxWidth: 492, indent: 46, lineHeight: 13 },
        objectiveData: { x: 50, y: 453, maxWidth: 492, indent: 181, lineHeight: 13 },
        diagnosis: { x: 50, y: 399, maxWidth: 492, indent: 43, lineHeight: 14 },
        recommendations: { x: 50, y: 258, maxWidth: 492, indent: 120, lineHeight: 14 },
        categories: { 'A': { x: 49, y: 332 }, 'B': { x: 49, y: 318 }, 'V': { x: 49, y: 305 }, 'G': { x: 49, y: 291 }, 'D': { x: 49, y: 277.5 } }
    };

    const TEMPLATES = {
        complaints: ["Жалоб не предъявляет.", "Жалобы на головные боли, быструю утомляемость, боли в области сердца, одышку.", "Жалобы на периодические боли в пояснице, ограничение подвижности."],
        anamnesis: ["Ранее перенесённые заболевания: не переносил. Хронических заболеваний не выявлено. Травм, операций не было. На учёте у врачей не состоит.", "Ранее перенесённые заболевания: ОРВИ, ангина, пневмония. Хронических заболеваний не выявлено. Травм, операций не было. На учёте у врачей не состоит.", "Ранее перенесённые заболевания: ОРВИ. Хронические заболевания: [название]. Состоит на учёте у [специалист] с [год]. Регулярно наблюдается.", "Ранее перенесённые заболевания: ОРВИ. Травмы: перелом левой голени в 2026 г. Операции: [перечислить]. Хронических заболеваний не выявлено."],
        objectiveData: ["Общее состояние удовлетворительное. Кожные покровы чистые, обычной окраски. Дыхание везикулярное, хрипов нет. Тоны сердца ясные, ритмичные. АД 120/80 мм рт.ст., пульс 72 уд/мин. Живот мягкий, безболезненный. Физическое развитие соответствует возрасту.", "Общее состояние удовлетворительное. Кожные покровы чистые. Дыхание везикулярное, хрипов нет. Тоны сердца ясные, ритмичные. АД [указать] мм рт.ст., пульс [указать] уд/мин. Живот мягкий, безболезненный. [Указать отклонения]."],
        diagnosis: ["Практически здоров.", "Гипертоническая болезнь I стадии.", "Последствия перенесённой травмы [название]. Без нарушения функций."],
        recommendations: ["Годен к военной службе без ограничений.", "Годен с незначительными ограничениями. Рекомендовано: служба в частях, не связанных с повышенными физическими нагрузками.", "Временно не годен. Рекомендована отсрочка на [срок]. Повторное освидетельствование через [срок].", "Не годен к военной службе. Освобождается от воинской обязанности."]
    };

    const MONTHS_GENITIVE = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];
    let currentPdfBlob = null;

    async function loadCitizens() {
        const select = document.getElementById('patientSelect');
        const { data: citizens } = await supabaseClient.from('profiles').select('*').eq('role', 'patient').order('last_name');
        if (!citizens) return;
        select.innerHTML = '<option value="none">-- Без гражданина (В архив) --</option>';
        citizens.forEach(p => {
            const opt = document.createElement('option');
            opt.value = p.id;
            opt.dataset.citizen = JSON.stringify(p);
            opt.textContent = `${p.last_name} ${p.first_name} ${p.patronymic || ''}`;
            select.appendChild(opt);
        });
    }

    document.getElementById('patientSelect').addEventListener('change', (e) => {
        const selectedOption = e.target.options[e.target.selectedIndex];
        if (!selectedOption.value || selectedOption.value === 'none') {
            ['firstName', 'patronymic', 'pob', 'address', 'passSeries', 'passNumber', 'dobDay', 'dobYear'].forEach(id => document.getElementById(id).value = '');
            document.getElementById('dobMonth').value = MONTHS_GENITIVE[0];
            return;
        }
        const citizen = JSON.parse(selectedOption.dataset.citizen);
        document.getElementById('firstName').value = citizen.first_name || '';
        document.getElementById('patronymic').value = citizen.patronymic || '';
        if (citizen.dob) {
            const [year, month, day] = citizen.dob.split('-');
            document.getElementById('dobDay').value = day;
            document.getElementById('dobMonth').value = MONTHS_GENITIVE[parseInt(month) - 1];
            document.getElementById('dobYear').value = year.slice(-2);
        }
        document.getElementById('pob').value = citizen.pob || '';
        document.getElementById('address').value = citizen.address || '';
        document.getElementById('passSeries').value = citizen.pass_series || '';
        document.getElementById('passNumber').value = citizen.pass_number || '';
    });

    function initTemplates() {
        for (const [fieldId, options] of Object.entries(TEMPLATES)) {
            const select = document.getElementById(`template-${fieldId}`);
            const textarea = document.getElementById(fieldId);
            options.forEach((text, index) => {
                const opt = document.createElement('option');
                opt.value = text;
                opt.textContent = `Вариант ${index + 1}`;
                select.appendChild(opt);
            });
            select.addEventListener('change', (e) => { if (e.target.value) textarea.value = e.target.value; });
        }
    }

    function initMonths() {
        const dateMonthSelect = document.getElementById('dateMonth');
        const dobMonthSelect = document.getElementById('dobMonth');
        MONTHS_GENITIVE.forEach((month) => {
            dateMonthSelect.add(new Option(month, month));
            dobMonthSelect.add(new Option(month, month));
        });
    }

    function initAutoDate() {
        const today = new Date();
        document.getElementById('dateDay').value = String(today.getDate()).padStart(2, '0');
        document.getElementById('dateMonth').value = MONTHS_GENITIVE[today.getMonth()];
        document.getElementById('dateYear').value = today.getFullYear();
        document.getElementById('docNumber').value = `0433${String(Math.floor(Math.random() * 999)).padStart(3, '0')}`;
    }

    function drawCenteredInRange(page, text, xStart, xEnd, y, options) {
        if (!text) return;
        const textWidth = options.font.widthOfTextAtSize(text, options.size);
        const startX = xStart + ((xEnd - xStart) - textWidth) / 2;
        page.drawText(text, { ...options, x: startX, y });
    }

    function drawParagraph(page, text, x, y, options) {
        if (!text) return;
        const { font, size, color, maxWidth, lineHeight, indent } = options;
        const words = text.split(' ');
        let lines = [], currentLine = '', isFirstLine = true;
        for (let word of words) {
            const availableWidth = isFirstLine ? (maxWidth - indent) : maxWidth;
            const testLine = currentLine === '' ? word : currentLine + ' ' + word;
            if (font.widthOfTextAtSize(testLine, size) <= availableWidth) {
                currentLine = testLine;
            } else {
                lines.push({ text: currentLine, isFirst: isFirstLine });
                currentLine = word;
                isFirstLine = false;
            }
        }
        if (currentLine !== '') lines.push({ text: currentLine, isFirst: isFirstLine });
        let currentY = y;
        for (let line of lines) {
            const currentX = line.isFirst ? x + indent : x;
            page.drawText(line.text, { x: currentX, y: currentY, font, size, color });
            currentY -= lineHeight;
        }
    }

    function drawCheckmark(page, x, y, color) {
        page.drawLine({ start: { x: x, y: y + 4 }, end: { x: x + 4, y: y }, thickness: 1.5, color: color });
        page.drawLine({ start: { x: x + 4, y: y }, end: { x: x + 10, y: y + 8 }, thickness: 1.5, color: color });
    }

    document.getElementById('close-preview-btn').addEventListener('click', () => {
        document.getElementById('preview-modal').style.display = 'none';
        document.getElementById('pdf-preview-frame').src = '';
        window.location.href = 'index.html';
    });

    document.getElementById('download-btn').addEventListener('click', () => {
        if (!currentPdfBlob) return;
        const docNumber = document.getElementById('docNumber').value;
        const link = document.createElement('a');
        link.href = URL.createObjectURL(currentPdfBlob);
        link.download = `Заключение_ВВК_${docNumber}.pdf`;
        link.click();
    });

    document.getElementById('vvkForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const citizenVal = document.getElementById('patientSelect').value;
        const actualCitizenId = (citizenVal === 'none') ? null : citizenVal;

        btn.disabled = true;
        btn.textContent = 'Генерация...';

        try {
            // ЖЕСТКО ЗАГРУЖАЕМ ШАБЛОН ВВК
            const url = './template.pdf'; 
            const existingPdfBytes = await fetch(url).then(res => res.arrayBuffer());
            const pdfDoc = await PDFLib.PDFDocument.load(existingPdfBytes);
            pdfDoc.registerFontkit(fontkit);
            
            const fontUrl = 'https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/fonts/Roboto/Roboto-Regular.ttf';
            const fontBytes = await fetch(fontUrl).then(res => res.arrayBuffer());
            const customFont = await pdfDoc.embedFont(fontBytes);
            
            const firstPage = pdfDoc.getPages()[0];
            const getVal = (id) => document.getElementById(id).value;
            const textOptions = { size: 10, font: customFont, color: PDFLib.rgb(0, 0, 0) };
            const paraOptions = { ...textOptions }; 

            drawCenteredInRange(firstPage, getVal('dateDay'), COORDS.date.day.xStart, COORDS.date.day.xEnd, COORDS.date.day.y, textOptions);
            drawCenteredInRange(firstPage, getVal('dateMonth'), COORDS.date.month.xStart, COORDS.date.month.xEnd, COORDS.date.month.y, textOptions);
            drawCenteredInRange(firstPage, getVal('dateYear'), COORDS.date.year.xStart, COORDS.date.year.xEnd, COORDS.date.year.y, textOptions);
            drawCenteredInRange(firstPage, getVal('docNumber'), COORDS.docNumber.xStart, COORDS.docNumber.xEnd, COORDS.docNumber.y, textOptions);
            
            drawCenteredInRange(firstPage, getVal('dobDay'), COORDS.dob.day.xStart, COORDS.dob.day.xEnd, COORDS.dob.day.y, textOptions);
            drawCenteredInRange(firstPage, getVal('dobMonth'), COORDS.dob.month.xStart, COORDS.dob.month.xEnd, COORDS.dob.month.y, textOptions);
            drawCenteredInRange(firstPage, getVal('dobYear'), COORDS.dob.year.xStart, COORDS.dob.year.xEnd, COORDS.dob.year.y, textOptions);
            drawCenteredInRange(firstPage, getVal('passSeries'), COORDS.passSeries.xStart, COORDS.passSeries.xEnd, COORDS.passSeries.y, textOptions);
            drawCenteredInRange(firstPage, getVal('passNumber'), COORDS.passNumber.xStart, COORDS.passNumber.xEnd, COORDS.passNumber.y, textOptions);
            drawCenteredInRange(firstPage, getVal('summons'), COORDS.summons.xStart, COORDS.summons.xEnd, COORDS.summons.y, textOptions);

            firstPage.drawText(getVal('chairman'), { x: COORDS.chairman.x, y: COORDS.chairman.y, ...textOptions });
            firstPage.drawText(getVal('firstName'), { x: COORDS.firstName.x, y: COORDS.firstName.y, ...textOptions });
            firstPage.drawText(getVal('patronymic'), { x: COORDS.patronymic.x, y: COORDS.patronymic.y, ...textOptions });
            firstPage.drawText(getVal('pob'), { x: COORDS.pob.x, y: COORDS.pob.y, ...textOptions });
            firstPage.drawText(getVal('address'), { x: COORDS.address.x, y: COORDS.address.y, ...textOptions });

            drawParagraph(firstPage, getVal('complaints'), COORDS.complaints.x, COORDS.complaints.y, { ...paraOptions, maxWidth: COORDS.complaints.maxWidth, indent: COORDS.complaints.indent, lineHeight: COORDS.complaints.lineHeight });
            drawParagraph(firstPage, getVal('anamnesis'), COORDS.anamnesis.x, COORDS.anamnesis.y, { ...paraOptions, maxWidth: COORDS.anamnesis.maxWidth, indent: COORDS.anamnesis.indent, lineHeight: COORDS.anamnesis.lineHeight });
            drawParagraph(firstPage, getVal('objectiveData'), COORDS.objectiveData.x, COORDS.objectiveData.y, { ...paraOptions, maxWidth: COORDS.objectiveData.maxWidth, indent: COORDS.objectiveData.indent, lineHeight: COORDS.objectiveData.lineHeight });
            drawParagraph(firstPage, getVal('diagnosis'), COORDS.diagnosis.x, COORDS.diagnosis.y, { ...paraOptions, maxWidth: COORDS.diagnosis.maxWidth, indent: COORDS.diagnosis.indent, lineHeight: COORDS.diagnosis.lineHeight });
            drawParagraph(firstPage, getVal('recommendations'), COORDS.recommendations.x, COORDS.recommendations.y, { ...paraOptions, maxWidth: COORDS.recommendations.maxWidth, indent: COORDS.recommendations.indent, lineHeight: COORDS.recommendations.lineHeight });

            const category = document.querySelector('input[name="category"]:checked').value;
            if (category) {
                const pos = COORDS.categories[category];
                drawCheckmark(firstPage, pos.x, pos.y, PDFLib.rgb(0, 0, 0));
            }

            const pdfBytes = await pdfDoc.save();
            currentPdfBlob = new Blob([pdfBytes], { type: 'application/pdf' });
            
            const docNumber = getVal('docNumber');
            const fileName = `${Date.now()}_VVK_${docNumber}.pdf`;

            await supabaseClient.storage.from('documents').upload(fileName, currentPdfBlob, { contentType: 'application/pdf' });
            await supabaseClient.from('documents').insert({
                patient_id: actualCitizenId,
                organization_id: currentOrgId,
                doc_number: docNumber,
                document_type: 'Заключение ВВК',
                file_path: fileName
            });

            const fileUrl = URL.createObjectURL(currentPdfBlob);
            document.getElementById('pdf-preview-frame').src = fileUrl + '#' + Date.now();
            document.getElementById('preview-modal').style.display = 'flex';

        } catch (error) {
            console.error(error);
            alert("Ошибка: " + error.message);
        } finally {
            btn.disabled = false;
            btn.textContent = 'Сгенерировать и сохранить PDF';
        }
    });

    initTemplates();
    initMonths();
    initAutoDate();
    loadCitizens();
</script>
</body>
</html>
