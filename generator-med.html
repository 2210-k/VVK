<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор Медицинской справки</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; padding: 15px; margin: 0; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        input[type="text"], input[type="date"], textarea, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        textarea { resize: vertical; height: 60px; }
        .form-select { background-color: #eef5ff; font-weight: bold; margin-bottom: 5px; cursor: pointer; }
        button[type="submit"] { background: #0056b3; color: white; border: none; padding: 15px; font-size: 16px; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 20px; font-weight: bold; }
        button[type="submit"]:hover { background: #004494; }
        button[type="submit"]:disabled { background: #ccc; cursor: not-allowed; }
        .row { display: flex; gap: 15px; flex-wrap: wrap; }
        .row > .form-group { flex: 1; min-width: 200px; }
        .date-group { display: flex; gap: 5px; }
        .date-group input, .date-group select, .center-input { text-align: center; }
        .date-group .day { width: 25%; }
        .date-group .month { width: 45%; }
        .date-group .year { width: 25%; }
        .back-btn { display: inline-block; margin-bottom: 20px; color: #0056b3; text-decoration: none; font-weight: bold; }
        .patient-selector { background: #eef5ff; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #b3ccee; }
        
        .doctor-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; background: #f9f9f9; padding: 8px; border-radius: 4px; }
        .doctor-row span { width: 180px; font-weight: bold; font-size: 14px; }
        .doctor-row label { margin: 0; font-weight: normal; display: flex; align-items: center; gap: 5px; cursor: pointer; }
        
        .checkbox-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .checkbox-main { display: flex; align-items: center; gap: 8px; font-weight: bold; font-size: 14px; }
        .checkbox-sub-group { display: flex; flex-wrap: wrap; gap: 10px; padding-left: 25px; font-size: 13px; color: #555; }
        .checkbox-item { display: flex; align-items: center; gap: 5px; cursor: pointer; }
        .checkbox-item input { width: 16px; height: 16px; cursor: pointer; }

        #preview-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; flex-direction: column; }
        .preview-container { width: 95%; height: 95%; background: white; border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .preview-header { padding: 15px 20px; background: #f8fafc; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; }
        .preview-header h3 { margin: 0; color: #333; }
        .btn-preview { border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px; }
        .btn-dl { background: #10b981; color: white; }
        .btn-close { background: #ef4444; color: white; }
        .preview-iframe { flex: 1; width: 100%; border: none; }
    </style>
</head>

    function drawCenteredInRange(page, text, xStart, xEnd, y, options) {
        if (!text) return;
        const textWidth = options.font.widthOfTextAtSize(text, options.size);
        const startX = xStart + ((xEnd - xStart) - textWidth) / 2;
        page.drawText(text, { ...options, x: startX, y });
    }

    function drawParagraph(page, text, x, y, options) {
        if (!text) return;
        const { font, size, color, maxWidth, lineHeight, indent } = options;
        const words = text.split(' ');
        let lines = [], currentLine = '', isFirstLine = true;
        for (let word of words) {
            const availableWidth = isFirstLine ? (maxWidth - indent) : maxWidth;
            const testLine = currentLine === '' ? word : currentLine + ' ' + word;
            if (font.widthOfTextAtSize(testLine, size) <= availableWidth) {
                currentLine = testLine;
            } else {
                lines.push({ text: currentLine, isFirst: isFirstLine });
                currentLine = word;
                isFirstLine = false;
            }
        }
        if (currentLine !== '') lines.push({ text: currentLine, isFirst: isFirstLine });
        let currentY = y;
        for (let line of lines) {
            const currentX = line.isFirst ? x + indent : x;
            page.drawText(line.text, { x: currentX, y: currentY, font, size, color });
            currentY -= lineHeight;
        }
    }

            const page2 = pages.length > 1 ? pages[1] : null;

            const textOptions = { size: 10, font: customFont, color: PDFLib.rgb(0, 0, 0) };
            const getVal = (id) => document.getElementById(id).value;

            const dateDay = getVal('dateDay');
            const dateMonth = getVal('dateMonth');
            const dateYear = getVal('dateYear');
            const dateMonthGenitive = MONTHS_GENITIVE[parseInt(dateMonth) - 1];

            // Считаем дату окончания (+50 дней)
            const issueDate = new Date(2000 + parseInt(dateYear), parseInt(dateMonth) - 1, parseInt(dateDay));
            issueDate.setDate(issueDate.getDate() + 50);
            const expDay = String(issueDate.getDate()).padStart(2, '0');
            const expMonth = MONTHS_GENITIVE[issueDate.getMonth()];
            const expYear = String(issueDate.getFullYear()).slice(-2);

            // --- СТРАНИЦА 1 ---
            drawCenteredInRange(firstPage, dateDay, COORDS.date.day.xStart, COORDS.date.day.xEnd, COORDS.date.day.y, textOptions);
            drawCenteredInRange(firstPage, dateMonthGenitive, COORDS.date.month.xStart, COORDS.date.month.xEnd, COORDS.date.month.y, textOptions);
            drawCenteredInRange(firstPage, dateYear, COORDS.date.year.xStart, COORDS.date.year.xEnd, COORDS.date.year.y, textOptions);
            drawCenteredInRange(firstPage, getVal('docNumber'), COORDS.docNumber.xStart, COORDS.docNumber.xEnd, COORDS.docNumber.y, textOptions);

            firstPage.drawText(getVal('firstName'), { x: COORDS.firstName.x, y: COORDS.firstName.y, ...textOptions });
            firstPage.drawText(getVal('patronymic'), { x: COORDS.patronymic.x, y: COORDS.patronymic.y, ...textOptions });

            const dobMonthGenitive = MONTHS_GENITIVE[parseInt(getVal('dobMonth')) - 1];
            drawCenteredInRange(firstPage, getVal('dobDay'), COORDS.dob.day.xStart, COORDS.dob.day.xEnd, COORDS.dob.day.y, textOptions);
            drawCenteredInRange(firstPage, dobMonthGenitive, COORDS.dob.month.xStart, COORDS.dob.month.xEnd, COORDS.dob.month.y, textOptions);
            drawCenteredInRange(firstPage, getVal('dobYear'), COORDS.dob.year.xStart, COORDS.dob.year.xEnd, COORDS.dob.year.y, textOptions);

            firstPage.drawText(getVal('pob'), { x: COORDS.pob.x, y: COORDS.pob.y, ...textOptions });
            firstPage.drawText(getVal('address'), { x: COORDS.address.x, y: COORDS.address.y, ...textOptions });

            drawCenteredInRange(firstPage, getVal('passSeries'), COORDS.passSeries.xStart, COORDS.passSeries.xEnd, COORDS.passSeries.y, textOptions);
            drawCenteredInRange(firstPage, getVal('passNumber'), COORDS.passNumber.xStart, COORDS.passNumber.xEnd, COORDS.passNumber.y, textOptions);

            firstPage.drawText(getVal('bloodType'), { x: COORDS.bloodType.x, y: COORDS.bloodType.y, ...textOptions });
            firstPage.drawText(getVal('rhFactor'), { x: COORDS.rhFactor.x, y: COORDS.rhFactor.y, ...textOptions });
            firstPage.drawText(getVal('allergies'), { x: COORDS.allergies.x, y: COORDS.allergies.y, ...textOptions });
            firstPage.drawText(getVal('chronicDiseases'), { x: COORDS.chronicDiseases.x, y: COORDS.chronicDiseases.y, ...textOptions });

            DOCTORS_LIST.forEach(doc => {
                const status = document.querySelector(`input[name="doc-${doc.id}"]:checked`).value;
                const coord = COORDS.doctors[doc.id];
                drawCenteredInRange(firstPage, status, coord.status.xStart, coord.status.xEnd, coord.status.y, textOptions);
                // ТУТ ДАТА ЦИФРАМИ (ДД.ММ.ГГ)
                drawCenteredInRange(firstPage, `${dateDay}.${dateMonth}.${dateYear}`, coord.date.xStart, coord.date.xEnd, coord.date.y, textOptions);
            });

            const ecgValue = getVal('ecg');
            if (ecgValue === 'normal') {
                firstPage.drawLine({ start: {x: COORDS.ecg.normal.xStart, y: COORDS.ecg.normal.y}, end: {x: COORDS.ecg.normal.xEnd, y: COORDS.ecg.normal.y}, thickness: 1, color: PDFLib.rgb(0,0,0) });
            } else {
                firstPage.drawLine({ start: {x: COORDS.ecg.abnormal.xStart, y: COORDS.ecg.abnormal.y}, end: {x: COORDS.ecg.abnormal.xEnd, y: COORDS.ecg.abnormal.y}, thickness: 1, color: PDFLib.rgb(0,0,0) });
            }

            // ФЛЮОРОГРАФИЯ (МЕСЯЦ СЛОВОМ)
            drawCenteredInRange(firstPage, dateDay, COORDS.fluorography.day.xStart, COORDS.fluorography.day.xEnd, COORDS.fluorography.day.y, textOptions);
            drawCenteredInRange(firstPage, dateMonthGenitive, COORDS.fluorography.month.xStart, COORDS.fluorography.month.xEnd, COORDS.fluorography.month.y, textOptions);
            drawCenteredInRange(firstPage, dateYear, COORDS.fluorography.year.xStart, COORDS.fluorography.year.xEnd, COORDS.fluorography.year.y, textOptions);

            firstPage.drawText(getVal('bloodTest'), { x: COORDS.bloodTest.x, y: COORDS.bloodTest.y, ...textOptions });
            firstPage.drawText(getVal('urineTest'), { x: COORDS.urineTest.x, y: COORDS.urineTest.y, ...textOptions });

            // ДЕНЬ ОКОНЧАНИЯ (000-999)
            // Вставляем количество дней (50) или день месяца. Если там написано "день", скорее всего это число.
            drawCenteredInRange(firstPage, "50", COORDS.expirationDayCount.xStart, COORDS.expirationDayCount.xEnd, COORDS.expirationDayCount.y, textOptions); 

            const nameStr = `${getVal('firstName')} ${getVal('patronymic')} (${getVal('passSeries')} ${getVal('passNumber')})`;
            firstPage.drawText(nameStr, { x: COORDS.conclusionName.x, y: COORDS.conclusionName.y, ...textOptions });

            const drawCross = (page, x, y) => {
                page.drawLine({ start: {x: x-3, y: y-3}, end: {x: x+3, y: y+3}, thickness: 1.5, color: PDFLib.rgb(0,0,0) });
                page.drawLine({ start: {x: x-3, y: y+3}, end: {x: x+3, y: y-3}, thickness: 1.5, color: PDFLib.rgb(0,0,0) });
            };
            
            if (document.getElementById('perm-drive').checked) drawCross(firstPage, COORDS.permissions.drive.x, COORDS.permissions.drive.y);
            if (document.getElementById('perm-license').checked) drawCross(firstPage, COORDS.permissions.license.x, COORDS.permissions.license.y);
            if (document.getElementById('perm-military').checked) drawCross(firstPage, COORDS.permissions.military.x, COORDS.permissions.military.y);
            if (document.getElementById('perm-state').checked) drawCross(firstPage, COORDS.permissions.state.x, COORDS.permissions.state.y);
            if (document.getElementById('perm-work').checked) drawCross(firstPage, COORDS.permissions.work.x, COORDS.permissions.work.y);

            if (document.getElementById('perm-drive-A').checked) drawCross(firstPage, COORDS.permissions.subPermissions.driveA.x, COORDS.permissions.subPermissions.driveA.y);
            if (document.getElementById('perm-drive-A1').checked) drawCross(firstPage, COORDS.permissions.subPermissions.driveA1.x, COORDS.permissions.subPermissions.driveA1.y);
            if (document.getElementById('perm-drive-M').checked) drawCross(firstPage, COORDS.permissions.subPermissions.driveM.x, COORDS.permissions.subPermissions.driveM.y);
            if (document.getElementById('perm-drive-B').checked) drawCross(firstPage, COORDS.permissions.subPermissions.driveB.x, COORDS.permissions.subPermissions.driveB.y);
            if (document.getElementById('perm-drive-B1').checked) drawCross(firstPage, COORDS.permissions.subPermissions.driveB1.x, COORDS.permissions.subPermissions.driveB1.y);
            if (document.getElementById('perm-drive-C').checked) drawCross(firstPage, COORDS.permissions.subPermissions.driveC.x, COORDS.permissions.subPermissions.driveC.y);
            if (document.getElementById('perm-drive-D').checked) drawCross(firstPage, COORDS.permissions.subPermissions.driveD.x, COORDS.permissions.subPermissions.driveD.y);

            if (document.getElementById('perm-license-taxi').checked) drawCross(firstPage, COORDS.permissions.subPermissions.licenseTaxi.x, COORDS.permissions.subPermissions.licenseTaxi.y);
            if (document.getElementById('perm-license-weapon').checked) drawCross(firstPage, COORDS.permissions.subPermissions.licenseWeapon.x, COORDS.permissions.subPermissions.licenseWeapon.y);

            if (document.getElementById('perm-state-ess').checked) drawCross(firstPage, COORDS.permissions.subPermissions.stateEss.x, COORDS.permissions.subPermissions.stateEss.y);
            if (document.getElementById('perm-state-mvd').checked) drawCross(firstPage, COORDS.permissions.subPermissions.stateMvd.x, COORDS.permissions.subPermissions.stateMvd.y);

            drawParagraph(firstPage, getVal('specialNotes'), COORDS.specialNotes.x, COORDS.specialNotes.y, { 
                ...textOptions, 
                maxWidth: COORDS.specialNotes.maxWidth, 
                lineHeight: COORDS.specialNotes.lineHeight,
                indent: COORDS.specialNotes.indent
            });

            // --- СТРАНИЦА 2 ---
            if (page2) {
                drawCenteredInRange(page2, dateDay, COORDS.page2.date.day.xStart, COORDS.page2.date.day.xEnd, COORDS.page2.date.day.y, textOptions);
                drawCenteredInRange(page2, dateMonthGenitive, COORDS.page2.date.month.xStart, COORDS.page2.date.month.xEnd, COORDS.page2.date.month.y, textOptions);
                drawCenteredInRange(page2, dateYear, COORDS.page2.date.year.xStart, COORDS.page2.date.year.xEnd, COORDS.page2.date.year.y, textOptions);
                drawCenteredInRange(page2, getVal('docNumber'), COORDS.page2.docNumber.xStart, COORDS.page2.docNumber.xEnd, COORDS.page2.docNumber.y, textOptions);
                drawCenteredInRange(page2, getVal('dayNumber'), COORDS.page2.dayNumber.xStart, COORDS.page2.dayNumber.xEnd, COORDS.page2.dayNumber.y, textOptions);

                drawCenteredInRange(page2, expDay, COORDS.page2.expirationDate.day.xStart, COORDS.page2.expirationDate.day.xEnd, COORDS.page2.expirationDate.day.y, textOptions);
                drawCenteredInRange(page2, expMonth, COORDS.page2.expirationDate.month.xStart, COORDS.page2.expirationDate.month.xEnd, COORDS.page2.expirationDate.month.y, textOptions);
                drawCenteredInRange(page2, expYear, COORDS.page2.expirationDate.year.xStart, COORDS.page2.expirationDate.year.xEnd, COORDS.page2.expirationDate.year.y, textOptions);

                drawCenteredInRange(page2, getVal('regNumber'), COORDS.page2.regNumber.xStart, COORDS.page2.regNumber.xEnd, COORDS.page2.regNumber.y, textOptions);
                
                drawParagraph(page2, getVal('serviceNotes'), COORDS.page2.serviceNotes.x, COORDS.page2.serviceNotes.y, { 
                    ...textOptions, 
                    maxWidth: COORDS.page2.serviceNotes.maxWidth, 
                    lineHeight: COORDS.page2.serviceNotes.lineHeight,
                    indent: COORDS.page2.serviceNotes.indent
                });
            }

            const pdfBytes = await pdfDoc.save();
            currentPdfBlob = new Blob([pdfBytes], { type: 'application/pdf' });
            
            const fileName = `${Date.now()}_MED_${getVal('docNumber')}.pdf`;

            await supabaseClient.storage.from('documents').upload(fileName, currentPdfBlob, { contentType: 'application/pdf' });
            await supabaseClient.from('documents').insert({
                patient_id: null,
                organization_id: currentOrgId,
                doc_number: getVal('docNumber'),
                document_type: 'Медицинская справка',
                file_path: fileName
            });

            const fileUrl = URL.createObjectURL(currentPdfBlob);
            document.getElementById('pdf-preview-frame').src = fileUrl + '#' + Date.now(); 
            document.getElementById('preview-modal').style.display = 'flex';

        } catch (error) {
            console.error(error);
            alert("Ошибка: " + error.message + "\nУбедитесь, что файл med_spravka.pdf загружен на GitHub!");
        } finally {
            btn.disabled = false;
            btn.textContent = 'Сгенерировать и сохранить PDF';
        }
    });

    initDoctors();
    initTemplates();
    initDates();
    loadCitizens();
</script>
</body>
</html>
