<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор Приказов ВЧ</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Библиотека для штрих-кода -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    
    <style>
        body { font-family: sans-serif; background: #f4f4f9; padding: 15px; margin: 0; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        input[type="text"], input[type="date"], textarea, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        .form-select { background-color: #eef5ff; font-weight: bold; margin-bottom: 5px; cursor: pointer; }
        button[type="submit"] { background: #0056b3; color: white; border: none; padding: 15px; font-size: 16px; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 20px; font-weight: bold; }
        button[type="submit"]:hover { background: #004494; }
        button[type="submit"]:disabled { background: #ccc; cursor: not-allowed; }
        .row { display: flex; gap: 15px; flex-wrap: wrap; }
        .row > .form-group { flex: 1; min-width: 150px; }
        .date-group { display: flex; gap: 5px; }
        .date-group input, .date-group select { text-align: center; }
        .date-group .day { width: 25%; }
        .date-group .month { width: 45%; }
        .date-group .year { width: 25%; }
        .back-btn { display: inline-block; margin-bottom: 20px; color: #0056b3; text-decoration: none; font-weight: bold; }
        .patient-selector { background: #eef5ff; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #b3ccee; }
        
        .section-title { background: #e2e8f0; padding: 10px; border-radius: 4px; margin-top: 20px; margin-bottom: 15px; font-weight: bold; color: #1e3a8a; }
        .type-block { display: none; background: #f9f9f9; padding: 15px; border-radius: 6px; border: 1px dashed #ccc; margin-top: 10px; }
        
        /* Стиль для галочки */
        .checkbox-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
        .checkbox-row input[type="checkbox"] { width: 20px; height: 20px; cursor: pointer; }
        .checkbox-row label { margin: 0; cursor: pointer; font-size: 16px; }

        #preview-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; flex-direction: column; }
        .preview-container { width: 95%; height: 95%; background: white; border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .preview-header { padding: 15px 20px; background: #f8fafc; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; flex-wrap: wrap; gap: 10px; }
        .preview-header h3 { margin: 0; color: #333; }
        .btn-preview { border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px; }
        .btn-dl { background: #10b981; color: white; }
        .btn-close { background: #ef4444; color: white; }
        .preview-iframe { flex: 1; width: 100%; border: none; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="back-btn">← Вернуться на портал</a>
    
    <div class="patient-selector">
        <label>👤 Выберите гражданина (данные подставятся)</label>
        <select id="patientSelect" class="form-select">
            <option value="none">-- Без гражданина (В архив) --</option>
        </select>
    </div>

    <h2>Приказ Войсковой части № 205</h2>
    
    <form id="prikazForm">
        
        <div class="row">
            <div class="form-group">
                <label>Дата приказа</label>
                <div class="date-group">
                    <input type="text" id="dateDay" class="day" placeholder="ДД" maxlength="2" required>
                    <select id="dateMonth" class="month" required></select>
                    <input type="text" id="dateYear" class="year" placeholder="ГГ" maxlength="2" required>
                </div>
            </div>
            <div class="form-group">
                <label>Номер дня (000-999)</label>
                <input type="text" id="dayNumber" class="center-input" placeholder="000" required>
            </div>
            <div class="form-group">
                <label>№ документа (0513ННН)</label>
                <input type="text" id="docNumber" class="center-input" required>
            </div>
        </div>

        <div class="form-group">
            <label>ФИО гражданина (Имя Отчество)</label>
            <input type="text" id="citizenName" required>
        </div>
        <div class="form-group">
            <label>Год рождения</label>
            <input type="text" id="citizenYear" placeholder="Например: 1990" required>
        </div>

        <div class="section-title">Тип приказа</div>
        <select id="orderType" class="form-select" onchange="switchOrderType()" required>
            <option value="">-- Выберите тип --</option>
            <option value="1">1. О зачислении в списки части</option>
            <option value="2">2. О присвоении воинского звания</option>
            <option value="3">3. Об увольнении в запас</option>
        </select>

        <!-- Блок 1: Зачисление -->
        <div id="block-1" class="type-block">
            <div class="row">
                <div class="form-group">
                    <label>Воинская должность</label>
                    <select id="pos1" class="form-select">
                        <option value="стрелок">стрелок</option>
                        <option value="водитель">водитель</option>
                        <option value="радист (связист)">радист (связист)</option>
                        <option value="пулемётчик">пулемётчик</option>
                        <option value="гранатомётчик">гранатомётчик</option>
                        <option value="механик-водитель">механик-водитель</option>
                        <option value="разведчик">разведчик</option>
                        <option value="снайпер">снайпер</option>
                        <option value="санитар">санитар</option>
                        <option value="повар">повар</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Номер взвода</label>
                    <select id="platoon1" class="form-select">
                        <option value="1-й">1-й</option>
                        <option value="2-й">2-й</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>№ повестки (Основание)</label>
                    <input type="text" id="summons1">
                </div>
            </div>
        </div>

        <!-- Блок 2: Звание -->
        <div id="block-2" class="type-block">
            <div class="row">
                <div class="form-group">
                    <label>Присвоить звание</label>
                    <select id="rank2" class="form-select">
                        <option value="Ефрейтор">Ефрейтор</option>
                        <option value="Младший сержант">Младший сержант</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Основание</label>
                    <select id="basis2" class="form-select">
                        <option value="успешного прохождения Курса молодого бойца (КМБ) и сдачи установленных зачетов">Успешное прохождение КМБ</option>
                        <option value="добросовестного исполнения служебных обязанностей и высоких показателей в боевой подготовке">Добросовестная служба</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Блок 3: Увольнение -->
        <div id="block-3" class="type-block">
            <div class="form-group">
                <label>Причина увольнения</label>
                <input type="text" id="reason3" class="form-select" value="Окончание срока военной службы по призыву">
            </div>
            
            <!-- ГАЛОЧКА ВЫДАЧИ ВОЕННОГО БИЛЕТА -->
            <div class="checkbox-row">
                <input type="checkbox" id="issueBilet" checked>
                <label for="issueBilet">Выдать военный билет (с отметкой об увольнении)</label>
            </div>
            <p style="color: #666; font-size: 12px; margin-top: 5px;">Если снять галочку, то пункт про военкомат изменится, а пункт про выдачу билета удалится.</p>
        </div>

        <button type="submit" id="submitBtn">Сгенерировать и сохранить PDF</button>
    </form>
</div>

<div id="preview-modal">
    <div class="preview-container">
        <div class="preview-header">
            <h3>Предпросмотр приказа</h3>
            <div>
                <button class="btn-preview btn-dl" id="download-btn">Скачать PDF</button>
                <button class="btn-preview btn-close" id="close-preview-btn">Закрыть</button>
            </div>
        </div>
        <iframe id="pdf-preview-frame" class="preview-iframe"></iframe>
    </div>
</div>

<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://unpkg.com/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>

<script>
    const supabaseClient = supabase.createClient('https://omnrekfdjurrfzrwfzzn.supabase.co', 'sb_publishable_v0z_8kT0ZmFH1uPiamR60w_vDNsIfKg');
    const urlParams = new URLSearchParams(window.location.search);
    const currentOrgId = parseInt(urlParams.get('org')) || 4;

    // =====================================================================
    // ⚠️ ТВОИ КООРДИНАТЫ ⚠️
    // =====================================================================
    const COORDS = {
        qrCode: { x: 43, y: 738, width: 85, height: 85 },
        barcode: { x: 461, y: 773, width: 85, height: 35 },
        date: { 
            day: { xStart: 42, xEnd: 57, y: 678.5}, 
            month: { xStart: 71, xEnd: 157, y: 678.5}, 
            year: { xStart: 192, xEnd: 206, y: 678.5} 
        },
        dayNumber: { xStart: 229, xEnd: 260, y: 679 },
        docNumber: { xStart: 496, xEnd: 546, y: 679 },
        orderTypeText: { y: 702, maxWidth: 592 },
        bodyText: { x: 34, y: 651, maxWidth: 525, lineHeight: 13 }
    };

    const MONTHS_NUMERIC = ["01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12"];
    const MONTHS_GENITIVE = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];
    let currentPdfBlob = null;

    function switchOrderType() {
        const type = document.getElementById('orderType').value;
        document.getElementById('block-1').style.display = (type === '1') ? 'block' : 'none';
        document.getElementById('block-2').style.display = (type === '2') ? 'block' : 'none';
        document.getElementById('block-3').style.display = (type === '3') ? 'block' : 'none';
    }

    function initMonths() {
        const selects = document.querySelectorAll('.month');
        selects.forEach(select => {
            MONTHS_NUMERIC.forEach((m, i) => {
                select.add(new Option(MONTHS_GENITIVE[i], MONTHS_NUMERIC[i]));
            });
        });
    }

    async function loadCitizens() {
        const select = document.getElementById('patientSelect');
        const { data: citizens } = await supabaseClient.from('profiles').select('*').eq('role', 'patient').order('last_name');
        if (!citizens) return;
        select.innerHTML = '<option value="none">-- Без гражданина --</option>';
        citizens.forEach(p => {
            const opt = document.createElement('option');
            opt.value = p.id;
            opt.dataset.citizen = JSON.stringify(p);
            opt.textContent = `${p.last_name} ${p.first_name} ${p.patronymic || ''}`;
            select.appendChild(opt);
        });
    }

    document.getElementById('patientSelect').addEventListener('change', (e) => {
        const opt = e.target.options[e.target.selectedIndex];
        if (!opt.value || opt.value === 'none') return;
        
        const c = JSON.parse(opt.dataset.citizen);
        document.getElementById('citizenName').value = `${c.first_name || ''} ${c.patronymic || ''}`.trim();
        if (c.dob) {
            document.getElementById('citizenYear').value = c.dob.split('-')[0];
        }
    });

    function initDates() {
        const today = new Date();
        document.getElementById('dateDay').value = String(today.getDate()).padStart(2, '0');
        document.getElementById('dateMonth').value = MONTHS_NUMERIC[today.getMonth()];
        document.getElementById('dateYear').value = String(today.getFullYear()).slice(-2);
        document.getElementById('docNumber').value = `0513${String(Math.floor(Math.random() * 999)).padStart(3, '0')}`;
    }

    async function createBarcodeImage(text) {
        const canvas = document.createElement('canvas');
        JsBarcode(canvas, text, {
            format: "CODE128", width: 2, height: 60, displayValue: false, margin: 0
        });
        const dataUrl = canvas.toDataURL("image/png");
        return await fetch(dataUrl).then(res => res.arrayBuffer());
    }

    async function createQrImage(text) {
        const url = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(text)}`;
        const response = await fetch(url);
        return await response.arrayBuffer();
    }

    function drawCenteredInRange(page, text, xStart, xEnd, y, options) {
        if (!text) return;
        const textWidth = options.font.widthOfTextAtSize(text, options.size);
        const startX = xStart + ((xEnd - xStart) - textWidth) / 2;
        page.drawText(text, { ...options, x: startX, y });
    }

    function drawTextBlockAndGetY(page, text, x, y, font, size, color, maxWidth, lineHeight) {
        if (!text) return y;
        const words = text.split(' ');
        let lines = [], currentLine = '';
        
        for (let word of words) {
            const testLine = currentLine === '' ? word : currentLine + ' ' + word;
            if (font.widthOfTextAtSize(testLine, size) <= maxWidth) {
                currentLine = testLine;
            } else {
                lines.push(currentLine);
                currentLine = word;
            }
        }
        if (currentLine !== '') lines.push(currentLine);

        let currentY = y;
        for (let line of lines) {
            page.drawText(line, { x: x, y: currentY, font: font, size: size, color: color });
            currentY -= lineHeight;
        }
        return currentY;
    }

    document.getElementById('close-preview-btn').addEventListener('click', () => {
        document.getElementById('preview-modal').style.display = 'none';
        document.getElementById('pdf-preview-frame').src = '';
        window.location.href = 'index.html';
    });

    document.getElementById('download-btn').addEventListener('click', () => {
        if (!currentPdfBlob) return;
        const link = document.createElement('a');
        link.href = URL.createObjectURL(currentPdfBlob);
        link.download = `Приказ_ВЧ_${document.getElementById('docNumber').value}.pdf`;
        link.click();
    });

    document.getElementById('prikazForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const type = document.getElementById('orderType').value;
        const patientId = document.getElementById('patientSelect').value;
        const actualCitizenId = (patientId === 'none') ? null : patientId;

        btn.disabled = true;
        btn.textContent = 'Генерация...';

        try {
            const url = './prikaz_vch.pdf'; 
            const existingPdfBytes = await fetch(url).then(res => res.arrayBuffer());
            const pdfDoc = await PDFLib.PDFDocument.load(existingPdfBytes);
            pdfDoc.registerFontkit(fontkit);
            
            const fontUrlReg = 'https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/fonts/Roboto/Roboto-Regular.ttf';
            const fontUrlBold = 'https://cdnjs.cloudflare.com/ajax/libs/ink/3.1.10/fonts/Roboto/roboto-bold-webfont.ttf';
            
            const fontBytesReg = await fetch(fontUrlReg).then(res => res.arrayBuffer());
            const fontBytesBold = await fetch(fontUrlBold).then(res => res.arrayBuffer());
            
            const customFont = await pdfDoc.embedFont(fontBytesReg);
            const boldFont = await pdfDoc.embedFont(fontBytesBold);
            
            const firstPage = pdfDoc.getPages()[0];
            const getVal = (id) => document.getElementById(id).value;
            
            const color = PDFLib.rgb(0, 0, 0);
            const docNum = getVal('docNumber');
            
            // Штрих-код
            const barcodeBytes = await createBarcodeImage(docNum);
            const barcodeImage = await pdfDoc.embedPng(barcodeBytes);
            firstPage.drawImage(barcodeImage, {
                x: COORDS.barcode.x, y: COORDS.barcode.y,
                width: COORDS.barcode.width, height: COORDS.barcode.height
            });

            // QR-код
            const dateStr = `${getVal('dateDay')}.${getVal('dateMonth')}.${getVal('dateYear')}`;
            const orderTypeName = document.getElementById('orderType').options[document.getElementById('orderType').selectedIndex].text;
            const qrText = `ВОИНСКАЯ ЧАСТЬ 205.\nПриказ № ${docNum} ${orderTypeName}.\n${getVal('citizenName')}\nДата: ${dateStr}`;
            const qrBytes = await createQrImage(qrText);
            const qrImage = await pdfDoc.embedPng(qrBytes);
            firstPage.drawImage(qrImage, {
                x: COORDS.qrCode.x, y: COORDS.qrCode.y,
                width: COORDS.qrCode.width, height: COORDS.qrCode.height
            });

            // Даты и номер
            const dateMonthStr = MONTHS_GENITIVE[MONTHS_NUMERIC.indexOf(getVal('dateMonth'))];
            const opt9 = { size: 10, font: customFont, color };
            
            drawCenteredInRange(firstPage, getVal('dateDay'), COORDS.date.day.xStart, COORDS.date.day.xEnd, COORDS.date.day.y, opt9);
            drawCenteredInRange(firstPage, dateMonthStr, COORDS.date.month.xStart, COORDS.date.month.xEnd, COORDS.date.month.y, opt9);
            drawCenteredInRange(firstPage, getVal('dateYear'), COORDS.date.year.xStart, COORDS.date.year.xEnd, COORDS.date.year.y, opt9);
            drawCenteredInRange(firstPage, getVal('dayNumber'), COORDS.dayNumber.xStart, COORDS.dayNumber.xEnd, COORDS.dayNumber.y, opt9);
            drawCenteredInRange(firstPage, docNum, COORDS.docNumber.xStart, COORDS.docNumber.xEnd, COORDS.docNumber.y, opt9);

            // Заголовок
            let typeTitle = "";
            if (type === '1') typeTitle = "О ЗАЧИСЛЕНИИ В СПИСКИ ЧАСТИ";
            else if (type === '2') typeTitle = "О ПРИСВОЕНИИ ВОИНСКОГО ЗВАНИЯ";
            else if (type === '3') typeTitle = "ОБ УВОЛЬНЕНИИ В ЗАПАС";

            const titleWidth = boldFont.widthOfTextAtSize(typeTitle, 10);
            firstPage.drawText(typeTitle, {
                x: (595 - titleWidth) / 2, 
                y: COORDS.orderTypeText.y, 
                font: boldFont, size: 10, color: color
            });

            // Блочное рисование
            let currentY = COORDS.bodyText.y;
            const fio = getVal('citizenName');
            const year = getVal('citizenYear');

            // 1. Вводная часть
            let introText = "";
            if (type === '1') introText = "В соответствии с Федеральным законом «О воинской обязанности и военной службе» и на основании прибытия гражданина из военного комиссариата Соль-Илецкого района,";
            else if (type === '2') introText = `В соответствии с Уставом внутренней службы Вооруженных Сил Российской Федерации, на основании ${getVal('basis2')},`;
            else if (type === '3') introText = `В связи с ${getVal('reason3').toLowerCase()}, в соответствии с Федеральным законом «О воинской обязанности и военной службе»,`;

            currentY = drawTextBlockAndGetY(firstPage, introText, COORDS.bodyText.x, currentY, customFont, 10, color, COORDS.bodyText.maxWidth, 13);
            
            // Отступ для ПРИКАЗЫВАЮ
            currentY -= 10;
            firstPage.drawText("ПРИКАЗЫВАЮ:", { x: COORDS.bodyText.x, y: currentY, font: boldFont, size: 10, color: color });
            currentY -= 23; // Отступ после

            // 2. Основная часть
            let bodyText = "";
            if (type === '1') {
                bodyText = `1. Зачислить с «${dateStr}» в списки войсковой части № 205 гражданина: ${fio}, ${year} года рождения.\n2. Присвоить воинское звание «Рядовой».\n3. Назначить на воинскую должность ${getVal('pos1')}.\n4. Зачислить в ${getVal('platoon1')} взвод.\n5. Поставить на все виды довольствия.`;
            } else if (type === '2') {
                bodyText = `1. Присвоить воинское звание «${getVal('rank2')}» гражданину: ${fio}, ${year} года рождения.\n2. Внести соответствующую запись в военный билет.`;
            } else if (type === '3') {
                const issueBilet = document.getElementById('issueBilet').checked;
                
                let p2 = issueBilet 
                    ? "2. Направить гражданина в военный комиссариат Соль-Илецкого района для постановки на воинский учёт." 
                    : "2. Исключить из списков личного состава части и снять со всех видов довольствия.";
                let p3 = issueBilet 
                    ? "\n3. Выдать военный билет с отметкой об увольнении." 
                    : "";

                bodyText = `1. Уволить с военной службы и исключить из списков войсковой части № 205 гражданина: ${fio}, ${year} года рождения.\n${p2}${p3}`;
            }

            // Рисуем построчно, чтобы сохранить \n
            const bodyLines = bodyText.split('\n');
            for (let i = 0; i < bodyLines.length; i++) {
                currentY = drawTextBlockAndGetY(firstPage, bodyLines[i], COORDS.bodyText.x, currentY, customFont, 10, color, COORDS.bodyText.maxWidth, 13);
            }

            // Отступ для Основания
            currentY -= 15;

            // 3. Основание
            let basisText = "";
            if (type === '1') basisText = `Основание: Повестка военного комиссариата Соль-Илецкого района № ${getVal('summons1')}.`;
            else if (type === '2') basisText = `Основание: Рапорт командира взвода.`;
            else if (type === '3') basisText = `Основание: ${getVal('reason3')}.`;

            drawTextBlockAndGetY(firstPage, basisText, COORDS.bodyText.x, currentY, customFont, 10, color, COORDS.bodyText.maxWidth, 13);

            // СОХРАНЕНИЕ
            const pdfBytes = await pdfDoc.save();
            currentPdfBlob = new Blob([pdfBytes], { type: 'application/pdf' });
            
            const fileName = `${Date.now()}_PRIKAZ_${docNum}.pdf`;

            await supabaseClient.storage.from('documents').upload(fileName, currentPdfBlob, { contentType: 'application/pdf' });
            await supabaseClient.from('documents').insert({
                patient_id: actualCitizenId,
                organization_id: currentOrgId,
                doc_number: docNum,
                document_type: 'Приказ ВЧ',
                file_path: fileName
            });

            const fileUrl = URL.createObjectURL(currentPdfBlob);
            document.getElementById('pdf-preview-frame').src = fileUrl + '#' + Date.now(); 
            document.getElementById('preview-modal').style.display = 'flex';

        } catch (error) {
            console.error(error);
            alert("Ошибка: " + error.message + "\nУбедитесь, что файл prikaz_vch.pdf загружен на GitHub!");
        } finally {
            btn.disabled = false;
            btn.textContent = 'Сгенерировать и сохранить PDF';
        }
    });

    initMonths();
    initDates();
    loadCitizens();
</script>
</body>
</html>
