<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заявление на увольнение</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; padding: 15px; margin: 0; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        input[type="text"], input[type="date"], select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        .form-select { background-color: #eef5ff; font-weight: bold; margin-bottom: 5px; cursor: pointer; }
        button[type="submit"] { background: #10b981; color: white; border: none; padding: 15px; font-size: 16px; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 20px; font-weight: bold; }
        button[type="submit"]:hover { background: #059669; }
        .row { display: flex; gap: 15px; flex-wrap: wrap; }
        .row > .form-group { flex: 1; min-width: 150px; }

        #preview-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; flex-direction: column; }
        .preview-container { width: 95%; height: 95%; background: white; border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; }
        .preview-header { padding: 15px 20px; background: #f8fafc; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; }
        .preview-iframe { flex: 1; width: 100%; border: none; }
        .btn-dl { background: #10b981; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; text-decoration: none; }
        .btn-close { background: #ef4444; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-left: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="color: #047857; margin-top: 0;">Заявление на увольнение</h2>
    <p style="color: #666; font-size: 14px; margin-bottom: 20px;">Данные из профиля (ФИО, паспорт) подтянутся автоматически.</p>

    <form id="zayavForm">
        
        <div class="row">
            <div class="form-group">
                <label>Организация</label>
                <select id="orgSelect" class="form-select" required>
                    <option value="">-- Выберите организацию --</option>
                    <option value="works">Работы (Таксопарк, Служба доставки и т.д.)</option>
                    <option value="ess">Единая служба спасения (ЕСС)</option>
                    <option value="mvd">Министерство внутренних дел (МВД)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Конкретное место (для "Работ")</label>
                <select id="specificOrgSelect" class="form-select" style="display: none;"></select>
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Должность</label>
                <select id="posSelect" class="form-select" required>
                    <option value="">-- Сначала выберите организацию --</option>
                </select>
            </div>
            <div class="form-group">
                <label>Причина увольнения</label>
                <input type="text" id="reason" placeholder="По собственному желанию" required>
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Дата увольнения</label>
                <input type="date" id="dismissDate" required>
            </div>
            <div class="form-group">
                <label>Кем и когда выдан паспорт</label>
                <input type="text" id="passIssued" placeholder="ОВД г. Соль-Илецка, 01.01.2020" required>
            </div>
        </div>

        <button type="submit" id="submitBtn">Сгенерировать заявление</button>
    </form>
</div>

<!-- Модалка предпросмотра -->
<div id="preview-modal">
    <div class="preview-container">
        <div class="preview-header">
            <h3>Предпросмотр</h3>
            <div>
                <a id="download-btn" href="#" class="btn-dl" download>Скачать PDF</a>
                <button class="btn-close" onclick="closePreview()">Закрыть</button>
            </div>
        </div>
        <iframe id="pdf-preview-frame" class="preview-iframe"></iframe>
    </div>
</div>

<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://unpkg.com/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>

<script>
    const supabaseClient = supabase.createClient('https://omnrekfdjurrfzrwfzzn.supabase.co', 'sb_publishable_v0z_8kT0ZmFH1uPiamR60w_vDNsIfKg');
    let currentPdfBlob = null;
    let userProfile = null;

    // --- СЛОВАРИ ДЛЯ ПАДЕЖЕЙ И СПИСКОВ ---
    const ORG_DATA = {
        'works': {
            nameGenitive: 'горнодобывающей организации / службы доставки', // общее
            managerDative: 'Начальнику / Заведующему',
            positions: ['Шахтёра', 'Курьера', 'Почтальона', 'Водителя такси', 'Водителя автобуса', 'Развозчика', 'Дальнобойщика', 'Водителя мусоровоза']
        },
        'ess': {
            nameGenitive: 'Единой службы спасения',
            managerDative: 'Начальнику департамента',
            positions: ['Водителя', 'Пожарного', 'Спасателя', 'Инспектора', 'Фельдшера', 'Врача', 'Нарколога', 'Хирурга']
        },
        'mvd': {
            nameGenitive: 'Министерства внутренних дел',
            managerDative: 'Генералу',
            positions: ['Рядового', 'Младшего сержанта', 'Сержанта', 'Старшины', 'Прапорщика', 'Младшего лейтенанта', 'Лейтенанта', 'Капитана', 'Майора', 'Подполковника']
        }
    };

    // Специфичные места работы для "Работ"
    const WORK_PLACES = [
        { id: 'mining', name: 'горнодобывающей организации', manager: 'Начальнику' },
        { id: 'courier', name: 'курьерской службы', manager: 'Начальнику' },
        { id: 'post', name: 'почтового отделения', manager: 'Заведующему' },
        { id: 'taxi', name: 'таксопарка', manager: 'Начальнику' },
        { id: 'bus', name: 'автобусной компании', manager: 'Начальнику' },
        { id: 'utility', name: 'коммунальной службы', manager: 'Заведующему' },
        { id: 'delivery', name: 'службы доставки', manager: 'Начальнику' },
        { id: 'transport', name: 'транспортной компании', manager: 'Начальнику' }
    ];

    // --- ЗАГРУЗКА ПРОФИЛЯ ---
    async function loadProfile() {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) { window.location.href = 'citizen.html'; return; }

        const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', session.user.id).single();
        if (profile) {
            userProfile = profile;
        }
    }

    // --- СКЛОНЕНИЕ ФИО (Родительный падеж) ---
    function declineFIO(last, first, patronymic) {
        if (!last || !first) return '';
        
        const declineName = (name, isMale) => {
            if (!name) return '';
            if (!isMale) {
                if (name.endsWith('а')) return name.slice(0, -1) + 'ы';
                if (name.endsWith('я')) return name.slice(0, -1) + 'и';
                return name;
            } else {
                if (name.endsWith('й')) return name.slice(0, -1) + 'я';
                if (name.endsWith('ь')) return name.slice(0, -1) + 'я';
                if (name.endsWith('а')) return name.slice(0, -1) + 'ы';
                if (!['а', 'я', 'о', 'е', 'у', 'ю', 'ы', 'и', 'э'].includes(name.slice(-1).toLowerCase())) {
                    return name + 'а';
                }
                return name;
            }
        };

        // Грубое определение пола по отчеству
        const isMale = !patronymic.endsWith('на');
        
        let resLast = last;
        if (isMale) {
            if (last.endsWith('ов') || last.endsWith('ев') || last.endsWith('ин')) resLast += 'а';
            else if (last.endsWith('ий')) resLast = last.slice(0, -2) + 'ого';
            else if (!last.endsWith('а') && !last.endsWith('я')) resLast += 'а';
            else if (last.endsWith('а')) resLast = last.slice(0, -1) + 'ой';
        } else {
            if (last.endsWith('ова') || last.endsWith('ева') || last.endsWith('ина')) resLast = last.slice(0, -1) + 'ой';
            else if (last.endsWith('ая')) resLast = last.slice(0, -2) + 'ой';
        }

        return `${resLast} ${declineName(first, isMale)} ${declineName(patronymic, isMale)}`;
    }

    // --- ЛОГИКА ФОРМЫ ---
    document.getElementById('orgSelect').addEventListener('change', (e) => {
        const org = e.target.value;
        const specSelect = document.getElementById('specificOrgSelect');
        const posSelect = document.getElementById('posSelect');

        specSelect.innerHTML = '';
        posSelect.innerHTML = '';

        if (org === 'works') {
            specSelect.style.display = 'block';
            specSelect.required = true;
            WORK_PLACES.forEach(place => {
                specSelect.innerHTML += `<option value="${place.id}">${place.name}</option>`;
            });
            // Заполняем должности для работ
            ORG_DATA['works'].positions.forEach(p => posSelect.innerHTML += `<option value="${p}">${p}</option>`);
        } else if (org === 'ess' || org === 'mvd') {
            specSelect.style.display = 'none';
            specSelect.required = false;
            ORG_DATA[org].positions.forEach(p => posSelect.innerHTML += `<option value="${p}">${p}</option>`);
        } else {
            specSelect.style.display = 'none';
            posSelect.innerHTML = '<option value="">-- Сначала выберите организацию --</option>';
        }
    });

    // --- РИСОВАНИЕ PDF ---
    function drawUnderlinedText(page, text, x, y, font, size) {
        page.drawText(text, { x: x, y: y, font: font, size: size, color: PDFLib.rgb(0, 0, 0) });
        const width = font.widthOfTextAtSize(text, size);
        page.drawLine({
            start: { x: x, y: y - 2 },
            end: { x: x + width + 5, y: y - 2 },
            thickness: 1,
            color: PDFLib.rgb(0, 0, 0)
        });
        return width + 5;
    }

    document.getElementById('zayavForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!userProfile) { alert('Профиль не загружен'); return; }

        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.textContent = 'Генерация...';

        try {
            const orgType = document.getElementById('orgSelect').value;
            let orgNameGenitive = ORG_DATA[orgType].nameGenitive;
            let managerDative = ORG_DATA[orgType].managerDative;
            
            if (orgType === 'works') {
                const specId = document.getElementById('specificOrgSelect').value;
                const place = WORK_PLACES.find(p => p.id === specId);
                orgNameGenitive = place.name;
                managerDative = place.manager;
            }

            const positionGenitive = document.getElementById('posSelect').value;
            const reason = document.getElementById('reason').value;
            const dismissDateStr = document.getElementById('dismissDate').value;
            const passIssued = document.getElementById('passIssued').value;

            // Форматирование даты увольнения
            const dDate = new Date(dismissDateStr);
            const months = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];
            const formattedDismissDate = `${dDate.getDate()} ${months[dDate.getMonth()]} ${dDate.getFullYear()}`;

            // Текущая дата для подписи
            const today = new Date();
            const formattedToday = `${String(today.getDate()).padStart(2, '0')}.${String(today.getMonth() + 1).padStart(2, '0')}.${today.getFullYear()}`;

            // Создаем PDF с нуля (А4)
            const pdfDoc = await PDFLib.PDFDocument.create();
            const page = pdfDoc.addPage([595.28, 841.89]);
            pdfDoc.registerFontkit(fontkit);

            const fontUrl = 'https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/fonts/Roboto/Roboto-Regular.ttf';
            const fontBytes = await fetch(fontUrl).then(res => res.arrayBuffer());
            const font = await pdfDoc.embedFont(fontBytes);

            const fioGenitive = declineFIO(userProfile.last_name, userProfile.first_name, userProfile.patronymic);

            // --- РИСОВАНИЕ ---
            let currentY = 780;
            const leftX = 50;
            const fontSize = 12;

            // 1. Кому
            page.drawText("Кому:", { x: leftX, y: currentY, font, size: fontSize });
            let xOffset = leftX + font.widthOfTextAtSize("Кому: ", fontSize);
            xOffset += drawUnderlinedText(page, `${managerDative}`, xOffset, currentY, font, fontSize);
            page.drawText(" ", { x: xOffset, y: currentY, font, size: fontSize });
            xOffset += 5;
            drawUnderlinedText(page, `${orgNameGenitive}`, xOffset, currentY, font, fontSize);
            
            currentY -= 40;

            // 2. От
            page.drawText("От:", { x: leftX, y: currentY, font, size: fontSize });
            xOffset = leftX + font.widthOfTextAtSize("От: ", fontSize);
            xOffset += drawUnderlinedText(page, `${positionGenitive}`, xOffset, currentY, font, fontSize);
            page.drawText(" ", { x: xOffset, y: currentY, font, size: fontSize });
            xOffset += 5;
            drawUnderlinedText(page, `${fioGenitive}`, xOffset, currentY, font, fontSize);

            currentY -= 60;

            // 3. ЗАЯВЛЕНИЕ (Заголовок)
            const title = "ЗАЯВЛЕНИЕ";
            const titleWidth = font.widthOfTextAtSize(title, 16);
            page.drawText(title, { x: (595.28 - titleWidth) / 2, y: currentY, font, size: 16 });
            currentY -= 40;

            // 4. Тело заявления
            // Первая строка
            page.drawText("Прошу уволить меня с должности", { x: leftX, y: currentY, font, size: fontSize });
            xOffset = leftX + font.widthOfTextAtSize("Прошу уволить меня с должности ", fontSize);
            xOffset += drawUnderlinedText(page, `${positionGenitive}`, xOffset, currentY, font, fontSize);
            
            page.drawText("в", { x: xOffset, y: currentY, font, size: fontSize });
            xOffset += font.widthOfTextAtSize("в ", fontSize);
            drawUnderlinedText(page, `${orgNameGenitive}`, xOffset, currentY, font, fontSize);

            currentY -= 25;

            // Вторая строка
            page.drawText("по", { x: leftX, y: currentY, font, size: fontSize });
            xOffset = leftX + font.widthOfTextAtSize("по ", fontSize);
            xOffset += drawUnderlinedText(page, `${reason}`, xOffset, currentY, font, fontSize);
            
            page.drawText("с", { x: xOffset, y: currentY, font, size: fontSize });
            xOffset += font.widthOfTextAtSize("с ", fontSize);
            xOffset += drawUnderlinedText(page, `${formattedDismissDate}`, xOffset, currentY, font, fontSize);
            page.drawText("года.", { x: xOffset, y: currentY, font, size: fontSize });

            currentY -= 40;

            // 5. Паспорт
            page.drawText("Паспорт:", { x: leftX, y: currentY, font, size: fontSize });
            xOffset = leftX + font.widthOfTextAtSize("Паспорт: ", fontSize);
            xOffset += drawUnderlinedText(page, `серия ${userProfile.pass_series || '____'} № ${userProfile.pass_number || '______'}`, xOffset, currentY, font, fontSize);
            page.drawText(", выдан", { x: xOffset, y: currentY, font, size: fontSize });
            xOffset += font.widthOfTextAtSize(", выдан ", fontSize);
            drawUnderlinedText(page, `${passIssued}`, xOffset, currentY, font, fontSize);

            currentY -= 100;

            // 6. Дата и подпись (внизу)
            page.drawText("Дата:", { x: leftX, y: currentY, font, size: fontSize });
            xOffset = leftX + font.widthOfTextAtSize("Дата: ", fontSize);
            drawUnderlinedText(page, `${formattedToday}`, xOffset, currentY, font, fontSize);

            const signX = 400;
            page.drawText("Подпись:", { x: signX, y: currentY, font, size: fontSize });
            xOffset = signX + font.widthOfTextAtSize("Подпись: ", fontSize);
            drawUnderlinedText(page, "_________________", xOffset, currentY, font, fontSize);

            // Сохранение и вывод
            const pdfBytes = await pdfDoc.save();
            currentPdfBlob = new Blob([pdfBytes], { type: 'application/pdf' });

            // Сохраняем в БД как "входящий" документ
            const fileName = `${Date.now()}_ZAYAVLENIE_${userProfile.last_name}.pdf`;
            const { data: { session } } = await supabaseClient.auth.getSession();
            
            // Сохраняем файл в Storage
            await supabaseClient.storage.from('documents').upload(fileName, currentPdfBlob, { contentType: 'application/pdf' });
            
            // Записываем в базу
            await supabaseClient.from('documents').insert({
                patient_id: session.user.id,
                organization_id: orgType === 'ess' ? 1 : orgType === 'mvd' ? 2 : 1, // Упрощенная привязка ID
                doc_number: `ЗАЯВ-${Math.floor(Math.random() * 999)}`,
                document_type: 'Заявление на увольнение',
                file_path: fileName
            });

            const fileUrl = URL.createObjectURL(currentPdfBlob);
            document.getElementById('pdf-preview-frame').src = fileUrl + '#' + Date.now(); 
            document.getElementById('preview-modal').style.display = 'flex';

        } catch (error) {
            console.error(error);
            alert("Ошибка: " + error.message);
        } finally {
            btn.disabled = false;
            btn.textContent = 'Сгенерировать заявление';
        }
    });

    function closePreview() {
        document.getElementById('preview-modal').style.display = 'none';
        document.getElementById('pdf-preview-frame').src = '';
        window.location.href = 'citizen.html';
    }

    // Запуск
    loadProfile();
</script>
</body>
</html>
